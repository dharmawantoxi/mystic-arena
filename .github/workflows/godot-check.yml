name: Godot Check

# ═══════════════════════════════════════════════════════
# VERIFIKASI PORT GODOT TANPA PERLU GODOT DI MESIN SENDIRI
#
# Kenapa ada: banyak bug port hanya muncul SAAT DIJALANKAN, bukan saat
# parse. Contoh nyata yang lolos semua cek statis:
#
#   Invalid assignment of property or key 'process_material' with value of
#   type 'ParticleProcessMaterial' on a base object of type 'CPUParticles2D'.
#
# Runner GitHub punya internet penuh, jadi di sinilah Godot betulan
# diunduh dan project benar-benar dijalankan headless.
#
# HEMAT KUOTA (pelajaran dari build-android.yml yang dibuat manual-only):
#   * hanya jalan kalau berkas Godot/tool yang berubah (filter `paths`),
#   * binary Godot di-cache antar run (unduh ~40 MB sekali saja),
#   * concurrency: push beruntun membatalkan run yang lama,
#   * timeout 15 menit; run normal ±2-3 menit.
#
# Jalan manual: tab Actions -> "Godot Check" -> Run workflow.
# ═══════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - 'godot/**'
      - '_core.py'
      - '_entity.py'
      - '_render.py'
      - 'hero_items.py'
      - 'hero_balance.py'
      - 'localization.py'
      - '_system.py'
      - 'tools/test_damage_school.py'
      - 'levels/**'
      - 'map_components/**'
      - 'bosses/**'
      - 'tools/convert_to_godot.py'
      - 'tools/test_godot_asset_pipeline.py'
      - 'tools/test_godot_debug_runner.py'
      - 'tools/godot_debug_run.py'
      - '.github/workflows/godot-run.yml'
      - 'tools/test_godot_match_parity.py'
      - 'tools/gen_boss_smart_ai.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'tools/gen_hero_skills_cpp.py'
      - 'tools/gen_levels_cpp.py'
      - 'tools/test_godot_level_data_parity.py'
      - 'tools/gen_maps_cpp.py'
      - 'tools/test_godot_map_data_parity.py'
      - 'ui_components/**'
      - 'tools/gen_ui_cpp.py'
      - 'tools/test_ui_cpp_selftest.py'
      - 'mobile/**'
      - 'tools/gen_mobile_cpp.py'
      - 'tools/test_mobile_cpp_selftest.py'
      - 'godot/addons/mystic_mobile/**'
      - 'splash_screen.py'
      - 'tools/gen_splash_cpp.py'
      - 'tools/test_godot_splash_parity.py'
      - 'tools/test_splash_cpp_selftest.py'
      - 'godot/gdext/**'
      - 'hero_skills/**'
      - 'tools/test_boss_true_aura_parity.py'
      - 'tools/test_basic_attack_no_impact_fx.py'
      - 'tools/test_system_perf_parity.py'
      - 'tools/test_render_parity.py'
      - 'tools/test_godot_localization_parity.py'
      - 'ui_theme.py'
      - 'tools/test_godot_ui_theme_parity.py'
      - 'tools/test_boss_draw_parity.py'
      - 'tools/test_boss_overlay_model_parity.py'
      - 'tools/test_boss_data_parity.py'
      - 'main_desktop_legacy.py'
      - 'main.py'
      - '.github/workflows/godot-check.yml'
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '_core.py'
      - '_entity.py'
      - '_render.py'
      - 'hero_items.py'
      - 'hero_balance.py'
      - 'localization.py'
      - '_system.py'
      - 'tools/test_damage_school.py'
      - 'levels/**'
      - 'map_components/**'
      - 'bosses/**'
      - 'tools/convert_to_godot.py'
      - 'tools/test_godot_asset_pipeline.py'
      - 'tools/test_godot_debug_runner.py'
      - 'tools/godot_debug_run.py'
      - '.github/workflows/godot-run.yml'
      - 'tools/test_godot_match_parity.py'
      - 'tools/gen_boss_smart_ai.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'tools/gen_hero_skills_cpp.py'
      - 'tools/gen_levels_cpp.py'
      - 'tools/test_godot_level_data_parity.py'
      - 'tools/gen_maps_cpp.py'
      - 'tools/test_godot_map_data_parity.py'
      - 'ui_components/**'
      - 'tools/gen_ui_cpp.py'
      - 'tools/test_ui_cpp_selftest.py'
      - 'mobile/**'
      - 'tools/gen_mobile_cpp.py'
      - 'tools/test_mobile_cpp_selftest.py'
      - 'godot/addons/mystic_mobile/**'
      - 'splash_screen.py'
      - 'tools/gen_splash_cpp.py'
      - 'tools/test_godot_splash_parity.py'
      - 'tools/test_splash_cpp_selftest.py'
      - 'godot/gdext/**'
      - 'hero_skills/**'
      - 'tools/test_boss_true_aura_parity.py'
      - 'tools/test_basic_attack_no_impact_fx.py'
      - 'tools/test_system_perf_parity.py'
      - 'tools/test_render_parity.py'
      - 'tools/test_godot_localization_parity.py'
      - 'ui_theme.py'
      - 'tools/test_godot_ui_theme_parity.py'
      - 'tools/test_boss_draw_parity.py'
      - 'tools/test_boss_overlay_model_parity.py'
      - 'tools/test_boss_data_parity.py'
      - 'main_desktop_legacy.py'
      - 'main.py'
      - '.github/workflows/godot-check.yml'
  workflow_dispatch:

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Harus sama dengan config/features di godot/project.godot
  GODOT_VERSION: '4.3'
  GODOT_RELEASE: 'stable'

jobs:
  check:
    name: Import + smoke test headless
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 0. Aset biner duplikat (di-gitignore, sumber: assets/ pygame) ──
      # sounds/ (AudioManager), items/ (33 ikon ItemIcons) dan presplash.png
      # (application/boot_splash/image). Disalin SEBELUM Godot dijalankan:
      #   * tanpa presplash, boot engine mencetak "Error opening file
      #     'res://assets/presplash.png'" + "Non-existing or invalid boot
      #     splash" ke log headless (tidak fatal untuk godot_log_gate, tapi
      #     noise yang menutupi error sungguhan);
      #   * tanpa items/, ikon item yang teruji adalah badge prosedural
      #     fallback, bukan PNG asli yang dikirim ke pemain.
      # --assets hanya os+shutil: tidak butuh pygame, numpy, maupun venv.
      - name: Salin aset biner (gitignored)
        run: python3 tools/convert_to_godot.py --assets

      # ── 1. Cek statis (tidak butuh engine, hitungan detik) ──
      - name: Linter statis
        run: |
          python -m pip install --quiet "gdtoolkit==4.*"
          echo "::group::gdparse (parser GDScript 4 asli)"
          gdparse $(find godot -name '*.gd')
          echo "::endgroup::"
          python3 godot/tools/tscn_lint.py $(find godot -name '*.tscn' -o -name '*.tres')
          python3 godot/tools/check_refs.py godot
          python3 godot/tools/particles_lint.py godot
          # Dua kali port menambahkan readout di atas arena yang tidak ada di
          # pygame (bar HP + pip level di kastil; baris "medan:" dan
          # "difficulty:" di bawah badge LEVEL/WAVE) dan menutupi peta. Gate ini
          # mengunci bentuk overlay nexus = crest + bar SHIELD saja, dan
          # melarang node readout medan kembali (lihat godot/tools/
          # map_clutter_lint.py untuk alasan + cermin _entity.py pygame).
          python3 godot/tools/map_clutter_lint.py godot
          python3 godot/tools/test_godot_log_gate.py
          # localization.py -> Localization.gd: tabel teks id/en (209 kunci x
          # 2 bahasa — 103 di antaranya layar MENU sejak 2026-09-13)
          # dibandingkan baris demi baris dengan modul pygame ASLI,
          # placeholder + pemakai tr_text()/loc() diaudit closed-world, dan
          # fixture LocalizationParityTest diperiksa segar. Tidak butuh pygame
          # maupun Godot — drift satu tanda baca pun gagal di sini, sebelum
          # engine diunduh.
          python3 tools/test_godot_localization_parity.py
          # Aset biner project Godot adalah SALINAN yang di-gitignore
          # (sounds/ items/ presplash.png). Cek ini mengunci seluruh rantainya
          # tanpa pygame maupun engine: items.json <-> assets/items/ (closed
          # world 33 ikon), converter punya export_* + mode --assets yang
          # tidak menuntut numpy, .gitignore menutup ketiganya, kedua
          # workflow menyalin sebelum Godot jalan, dan path res:// di
          # project.godot/ItemIcons.gd/AudioManager.gd == tujuan converter.
          python3 tools/test_godot_asset_pipeline.py
          # Jalur "Godot bisa dijalankan dari repo" (tools/godot_debug_run.py
          # + godot/scenes/debug/DebugRun.tscn + workflow godot-run.yml +
          # devcontainer Codespaces) punya EMPAT pemilik yang harus sepakat:
          # skenario & kunci argumen di Python == GDScript == dropdown
          # workflow. Salah ketik TIDAK error di Godot (argumen tak dikenal
          # diabaikan dalam diam) dan gejalanya cuma screenshot layar menu —
          # gate ini yang menolaknya, tanpa pygame maupun engine.
          python3 tools/test_godot_debug_runner.py
          # BossKit.gd adalah HASIL GENERATE dari bosses/base_boss.py —
          # gagal di sini berarti ada perubahan smart-AI pygame yang belum
          # ditranspile (regenerasi: python3 tools/gen_boss_smart_ai.py).
          python3 tools/gen_boss_smart_ai.py --check
          # HeroSkillKit.gd di-transpile dari hero_skills/_bundle.py — gagal di
          # sini berarti ada perubahan skill hero pygame yang belum
          # ditranspile (regenerasi: python3 tools/gen_hero_skill_kit.py).
          python3 tools/gen_hero_skill_kit.py --check
          # hero_skills_processor.h/.cpp (GDExtension C++ di
          # godot/gdext/mystic_skills) JUGA di-transpile dari _bundle.py yang
          # sama. Cek ini tidak butuh compiler: cuma membandingkan hasil
          # transpile dengan berkas ter-commit. Build + uji runtime-nya ada di
          # workflow terpisah godot-gdext.yml (butuh scons + godot-cpp).
          python3 tools/gen_hero_skills_cpp.py --check
          # levels/level_data.py -> Godot (FASE 34), dua cek yang menutup celah
          # berbeda:
          #   (a) --check = levels_processor.h/.cpp di godot/gdext/mystic_levels
          #       benar-benar hasil transpile AST level_data.py yang segar
          #       (byte-identik), bukan suntingan tangan atau keluaran basi;
          #   (b) test_godot_level_data_parity.py = SEMANTIK: levels.json +
          #       FIELD_KINDS LevelDB.gd + literal tabel C++ dibandingkan dengan
          #       ALL_LEVELS Python (54 level x 17 field + 4 helper), fixture
          #       LevelDataParityTest diperiksa segar, dan wiring diaudit
          #       closed-world (BossDB/GameManager/SaveManager -> LevelDBLoader,
          #       setting project.godot default false, entry_symbol
          #       .gdextension, .gitignore, kedua workflow).
          # Keduanya tanpa compiler dan tanpa engine; build + uji runtime C++
          # ada di godot-gdext.yml.
          python3 tools/gen_levels_cpp.py --check
          python3 tools/test_godot_level_data_parity.py
          # map_components/_bundle.py -> Godot (FASE 35), pasangan cek yang sama:
          #   (a) --check = maps_processor.h/.cpp benar-benar hasil transpile
          #       AST _bundle.py yang segar (byte-identik);
          #   (b) test_godot_map_data_parity.py = SEMANTIK: themes_raw.json +
          #       KEY_KINDS/waypoint/dekor/MT19937/derive MapDB.gd + literal
          #       C++ vs _bundle.py (54 tema x 77 kunci union + PathGenerator
          #       + DecorationGenerator), fixture MapDataParityTest segar, dan
          #       wiring diaudit closed-world (ArenaMap -> MapDBLoader, setting
          #       project.godot default false, entry_symbol .gdextension,
          #       .gitignore, kedua workflow).
          python3 tools/gen_maps_cpp.py --check
          python3 tools/test_godot_map_data_parity.py
          # ui_components/_bundle.py -> Godot C++ (FASE 36), pasangan cek sama:
          #   (a) --check = ui_processor.h/.cpp/ui_dispatch.inc byte-identik
          #       dengan transpile AST _bundle.py yang segar;
          #   (b) test_ui_cpp_selftest.py = MENG-EXECUTE ui_processor.cpp apa
          #       adanya lewat stub Variant (tanpa engine): 208 cek di CI /
          #       213 dengan checkout godot-cpp — nilai (fixture ui_hud =
          #       geometri popup/panel yang direkam pygame asli +
          #       _core.py/ui_theme.py), closed-world (tabel perintah
          #       == bind_static_method == deklarasi .h; setiap fungsi
          #       ter-bind diuji), dan audit wiring (entry symbol, allowlist
          #       SEMPIT godot_log_gate, rujukan kedua workflow, bentuk cek
          #       symbol .so yang benar).
          python3 tools/gen_ui_cpp.py --check
          python3 tools/test_ui_cpp_selftest.py
          # splash_screen.py -> Godot C++ (FASE 38), TIGA lapis tanpa engine:
          #   (a) --check = splash_processor.h/.cpp/splash_dispatch.inc
          #       byte-identik dengan transpile AST splash_screen.py yang segar;
          #   (b) test_splash_cpp_selftest.py = MENG-EXECUTE
          #       splash_processor.cpp apa adanya lewat stub Variant
          #       (godot/gdext/mystic_splash/selftest) — 1585 cek (1580 tanpa
          #       checkout godot-cpp) / 6524 perintah vs fixture
          #       splash_parity.json, closed-world (tabel
          #       perintah == bind_static_method == deklarasi .h; setiap fungsi
          #       ter-bind diuji). Butuh g++ saja (sudah ada di runner), dan
          #       kalau checkout godot-cpp ada ia juga compile+link+strip .so
          #       probe lalu mengulang cek langkah build godot-gdext.yml (entry
          #       via `nm -D`, isi modul via string yang tahan strip).
          # Lapisan (c) — tools/test_godot_splash_parity.py, yang MENJALANKAN
          # SplashScreen pygame ASLI (SDL dummy + font palsu + TrackSurface)
          # untuk merekam/menguji fixture — butuh pygame, jadi ikut langkah
          # "SplashParityTest" di bawah (pola UiThemeParityTest).
          python3 tools/gen_splash_cpp.py --check
          python3 tools/test_splash_cpp_selftest.py
          # Scope-check hasil generate (identifier harus terdeklarasi di
          # param/var lokal/bridge Hero.gd) — tangkap 'Identifier not
          # declared' sebelum engine.
          python3 tools/check_bosskit_scope.py godot/scenes/hero/HeroSkillKit.gd
          # BossOverlay.gd (FASE 32): KEMBARAN Python dari logika lapisan
          # overlay Boss.draw — konstanta dibaca langsung dari berkas .gd lalu
          # op-nya dibandingkan dengan fixture yang direkam pygame ASLI
          # (50 skenario, 647 op). Tidak butuh pygame maupun engine, jadi salah
          # transkripsi (floor division, int(), urutan lapisan, pita alpha)
          # ketahuan sebelum Godot diunduh.
          python3 tools/test_boss_overlay_model_parity.py

      # ── 2. Godot binary (di-cache) ──
      - name: Cache Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux-x86_64

      - name: Unduh Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          URL="https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "$URL"
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${V}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Versi Godot
        run: |
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          ~/godot-bin/godot --headless --version

      # ── 3. Import project: di sinilah .tscn/.tres/shader benar-benar dimuat ──
      # Import pertama pada checkout bersih memang mengeluarkan pesan "editor
      # needs to restart"; karena itu dijalankan dua kali, dan log yang dinilai
      # adalah yang KEDUA.
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path godot --import 2>&1 | tee /tmp/import1.log || true
          if grep -qi "unknown command line option" /tmp/import1.log; then
            # Jaga-jaga kalau versi Godot yang dipakai belum punya --import:
            # --editor --quit juga mengimpor lalu keluar.
            godot --headless --path godot --editor --quit 2>&1 | tee /tmp/import.log || true
          else
            # || true: bash runner default -e + pipefail; godot bisa exit != 0
            # saat ada script error — yang menilai lulus/gagal adalah gate,
            # bukan exit code (lihat komentar langkah "Versi Godot" di README).
            godot --headless --path godot --import 2>&1 | tee /tmp/import.log || true
          fi
          # if (bukan RC=$?): bash runner default -e menghentikan langkah
          # tepat di perintah yang gagal sebelum baris berikutnya jalan.
          if python3 godot/tools/godot_log_gate.py /tmp/import.log --label "import" > /tmp/gate.out 2>&1; then
            cat /tmp/gate.out
          else
            cat /tmp/gate.out
            # Pantulkan baris error sebagai anotasi ::error:: supaya penyebab
            # kegagalan terbaca langsung di tab Checks / API check-run tanpa
            # harus mengunduh log artifact.
            grep '|' /tmp/gate.out | sed 's/^[[:space:]]*[0-9]* |[[:space:]]*//' | head -5 | while read -r LINE; do
              [ -z "$LINE" ] && continue
              echo "::error::IMPORT-FAIL: $LINE"
            done
            echo "::error::IMPORT-FAIL-TAIL: $(tail -6 /tmp/import.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      # ── 4. Smoke test yang sudah ada di repo (keduanya self-quit + PASS line) ──
      # Langkah tes: || true + gate (exit code godot tidak bisa dipercaya —
      # lihat README bagian "F5 cuma layar hitam"); kalau gagal, pantulkan
      # ekor log sebagai anotasi ::error:: di tab Checks.
      - name: AIPlayerTest (menu, tanpa combat)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/AIPlayerTest.tscn --quit-after 120 2>&1 | tee /tmp/ai.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/ai.log --label "AIPlayerTest" \
              --require "[AIPlayerTest] PASS" > /tmp/ai.gate 2>&1; then
            cat /tmp/ai.gate
          else
            cat /tmp/ai.gate
            echo "::error::AI-FAIL-TAIL: $(tail -8 /tmp/ai.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      - name: BattleSmokeTest (menu → level 1 → wave + AI)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/BattleSmokeTest.tscn --quit-after 180 2>&1 | tee /tmp/smoke.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/smoke.log --label "BattleSmokeTest" \
              --require "[BattleSmokeTest] PASS" > /tmp/smoke.gate 2>&1; then
            cat /tmp/smoke.gate
          else
            cat /tmp/smoke.gate
            echo "::error::SMOKE-FAIL-TAIL: $(tail -8 /tmp/smoke.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      # Golden data comes from the actual Pygame methods, not a second
      # copy of the Godot formulas. Changes to either implementation run CI.
      - name: GameplayParityTest (Pygame oracle + match lifecycle)
        run: |
          set -o pipefail
          python -m pip install --quiet pygame-ce
          python3 tools/test_godot_match_parity.py
          godot --headless --path godot res://tests/GameplayParityTest.tscn --quit-after 300 2>&1 | tee /tmp/parity.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/parity.log --label "GameplayParityTest" \
              --require "[GameplayParityTest] PASS" > /tmp/parity.gate 2>&1; then
            cat /tmp/parity.gate
          else
            cat /tmp/parity.gate
            echo "::error::PARITY-FAIL-TAIL: $(tail -12 /tmp/parity.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      # --quit-after 960 (~16 dtk @60fps): tes menunggu animasi kematian yang
      # berbasis waktu nyata (90f true boss + perayaan + 60f mini boss).
      - name: CinematicTest (level intro, banner boss, death FX + perayaan)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/CinematicTest.tscn --quit-after 960 2>&1 | tee /tmp/cine.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/cine.log --label "CinematicTest" \
              --require "[CinematicTest] PASS" > /tmp/cine.gate 2>&1; then
            cat /tmp/cine.gate
          else
            cat /tmp/cine.gate
            echo "::error::CINE-FAIL-GATE: $(grep -m3 'FAIL\|ERROR' /tmp/cine.gate | tr '\n' ' | ' | cut -c1-300)"
            echo "::error::CINE-FAIL-TAIL: $(tail -12 /tmp/cine.log | tr '\n' ' | ' | cut -c1-400)"
            echo "::error::CINE-EXPECT: $(grep -m3 'CinematicTest' /tmp/cine.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      # ── 4b. BossCoreParityTest: paritas inti boss (resilience/anti-burst,
      # entrance, enrage/frenzy, tenacity, heal true boss, cleave, ability
      # generik) vs fixture boss_core dari Pygame Boss.update yang asli.
      - name: BossCoreParityTest (data 216 boss + perilaku inti boss)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/BossCoreParityTest.tscn --quit-after 420 2>&1 | tee /tmp/boss.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/boss.log --label "BossCoreParityTest" \
              --require "[BossCoreParityTest] PASS" > /tmp/boss.gate 2>&1; then
            cat /tmp/boss.gate
          else
            cat /tmp/boss.gate
            echo "::error::BOSS-FAIL-TAIL: $(tail -60 /tmp/boss.log | tr '\n' ' | ' | cut -c1-3500)"
            echo "::error::BOSS-FAIL-LINES: $(grep -m8 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/boss.log | tr '\n' ' | ' | cut -c1-2000)"
            exit 1
          fi

      # ── 4b2. HeroArchetypesParityTest: paritas port hero_archetypes.py ↔
      # HeroArchetypes.gd — konstanta kurva armor, semantik get_archetype
      # (override dmg_type, entri default derived), school_of,
      # physical_mitigation & _resist_from_profile vs konstanta oracle py,
      # get_boss_resistances 216 boss vs fixture boss_core (bosses.json
      # ikut dibandingkan), sinkron const ARCHETYPES ↔ data JSON, dan
