      # urutan), theme_index/get_theme/build_theme, make_curved_path (5 kasus),
      # lane/river 2 ukuran (titik PERSIS — menangkap deviasi float port lama),
      # dekor 14 kategori x 2 varian toko (replika MT19937), isolasi mutasi,
      # derive 54 palet vs themes.json (termasuk royal.energy = 1.169, kasus
      # batas double-rounding), dan wiring ArenaMap (scene asli).
      # Jalur C++ (MysticMaps) diuji MapDataGdextParityTest di godot-gdext.yml.
      - name: "MapDataParityTest (map_components/_bundle.py ↔ MapDB.gd)"
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/MapDataParityTest.tscn --quit-after 120 2>&1 | tee /tmp/maps.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/maps.log --label "MapDataParityTest" \
              --require "[MapDataParityTest] PASS" > /tmp/maps.gate 2>&1; then
            cat /tmp/maps.gate
          else
            cat /tmp/maps.gate
            echo "::error::MAPS-FAIL-TAIL: $(tail -40 /tmp/maps.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::MAPS-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/maps.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      - name: "UiThemeParityTest (ui_theme.py ↔ UiTheme.gd + widget)"
        run: |
          set -o pipefail
          isolated=$(mktemp -d)
          trap 'rm -rf "$isolated"' EXIT
          export XDG_DATA_HOME="$isolated"
          python -m pip install --quiet pygame-ce
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tools/test_godot_ui_theme_parity.py
          godot --headless --path godot res://tests/UiThemeParityTest.tscn --quit-after 200 2>&1 | tee /tmp/uitheme.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/uitheme.log --label "UiThemeParityTest" \
              --require "[UiThemeParityTest] PASS" > /tmp/uitheme.gate 2>&1; then
            cat /tmp/uitheme.gate
          else
            cat /tmp/uitheme.gate
            echo "::error::UITHEME-FAIL-TAIL: $(tail -40 /tmp/uitheme.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::UITHEME-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/uitheme.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      # ── 4y2. SplashParityTest (FASE 38): splash_screen.py ↔ SplashModel.gd ──
      # Oracle-nya dua lapis seperti UiTheme: (1) tools/
      # test_godot_splash_parity.py MENJALANKAN SplashScreen pygame ASLI (SDL
      # dummy + font palsu 7px/karakter + TrackSurface sebagai screen supaya
      # blit tertangkap) lalu merekam fixture: timeline 4 skenario x 200 frame
      # (title_alpha, _overall_alpha, done, DUA bendera skip), 46 partikel x
      # 120 langkah + nilai respawn RNG (random.uniform di-spy) + triplet
      # gambar, 48 batang gradien + 70 bingkai vignette + 9 probe PIKSEL
      # (interior layar HITAM pekat: alpha vignette menjenuh 255 pada i <= 24),
      # tabel grow logo + 64 cincin glow, 3 lapisan glow judul + 4 garis aksen,
      # hint, dan urutan blit/draw 2 skenario; ia juga mengaudit wiring
      # closed-world (SplashScreen.gd -> SplashBackend, project.godot default
      # false, .gdextension, .gitignore, allowlist SEMPIT godot_log_gate,
      # kedua workflow, arity tiap panggilan Backend.* di scene + test) dan
      # kesegaran fixture + SplashModel.gd (62 fungsi, API_SIGNATURE).
      # (2) Scene ini memutar ulang fixture itu di engine betulan dengan
      # backend DIPAKSA "gdscript" (jalur default produksi, tanpa compiler),
      # ditutup smoke test scene SplashScreen asli (fade in, skip -> finished).
      # Jalur C++ (MysticSplash) diuji SplashGdextParityTest di godot-gdext.yml.
      - name: "SplashParityTest (splash_screen.py ↔ SplashModel.gd)"
        run: |
          set -o pipefail
          python -m pip install --quiet pygame-ce
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tools/test_godot_splash_parity.py
          godot --headless --path godot res://tests/SplashParityTest.tscn --quit-after 400 2>&1 | tee /tmp/splash.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/splash.log --label "SplashParityTest" \
              --require "[SplashParityTest] PASS" > /tmp/splash.gate 2>&1; then
            cat /tmp/splash.gate
          else
            cat /tmp/splash.gate
            echo "::error::SPLASH-FAIL-TAIL: $(tail -40 /tmp/splash.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::SPLASH-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/splash.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      # ── 4z. BossDrawParityTest (FASE 32): LAPISAN OVERLAY Boss.draw() ──
      # Oracle tiga lapis. (1) tools/test_boss_draw_parity.py MENJALANKAN
      # Boss.draw pygame ASLI (SDL dummy) untuk 50 skenario — entrance
      # (eksklusif), aura ability/enrage/true boss, bayangan, indikator debuff
      # menara (_core.py:1037), badan generik, HP bar, papan nama + clamp tepi
      # layar — merekam setiap primitif gambar, mengonversinya ke OP KANONIK
      # (kosakata BossOverlay.gd), lalu MEMVERIFIKASI konversi itu dengan
      # PIKSEL: op kanonik digambar ulang dengan semantik pygame dan harus
      # identik byte-per-byte dengan render asli. Profil alpha aura diukur dari
      # render sungguhan (pygame.draw.circle MENIMPA -> pita alpha rata; port
      # naif draw_circle Godot yang mem-blend harus terbukti meleset). Fixture
      # yang di-commit wajib SEGAR terhadap pygame. (2) Kembaran Python-nya
      # sudah dicek di langkah statis. (3) Scene ini memutar ulang fixture di
      # engine betulan: op BossOverlay.underlay_ops/over_ops, plumbing
      # Boss.gd::overlay_state() dari node Boss asli + bosses.json (label_top,
      # entrance_text, warna, detik->frame), posisi BossPlate sesudah Visual,
      # dan raster exec() atas semua op.
      - name: "BossDrawParityTest (overlay Boss.draw ↔ BossOverlay.gd)"
        run: |
          set -o pipefail
          isolated=$(mktemp -d)
          trap 'rm -rf "$isolated"' EXIT
          export XDG_DATA_HOME="$isolated"
          python -m pip install --quiet pygame-ce
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tools/test_boss_draw_parity.py
          godot --headless --path godot res://tests/BossDrawParityTest.tscn --quit-after 400 2>&1 | tee /tmp/bossdraw.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/bossdraw.log --label "BossDrawParityTest" \
              --require "[BossDrawParityTest] PASS" > /tmp/bossdraw.gate 2>&1; then
            cat /tmp/bossdraw.gate
          else
            cat /tmp/bossdraw.gate
            echo "::error::BOSSDRAW-FAIL-TAIL: $(tail -40 /tmp/bossdraw.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::BOSSDRAW-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/bossdraw.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      # ── 4z2. BossDataParityTest (FASE 32): PIPELINE DATA boss_data.py ──
      # boss_data.py menjalankan 5 fungsi pada saat import dan menimpa tabelnya
      # sendiri (rebalance piecewise -> smoothing monoton per slot wave/level ->
      # curve override -> normalisasi stat hero_unlock least-squares + clamp +
      # running-max -> normalisasi range melee/ranged). BossData.gd mem-port
      # kelimanya dan BossDB memakainya sebagai jalur pemulihan katalog.
      # Oracle-nya merekam 3024 field dari modul boss_data ASLI dan 3024 field
      # dari ekspor baker (bosses.json + boss_stats_full.json), mengukur
      # invariant pipeline (monoton, lantai piecewise, pita clamp, skill_range
      # >= range), mengunci gotcha GDScript (pow(d,2) vs d*d, round banker's,
      # pembagian float, sort stabil, truthiness dict kosong), lalu menulis
      # fixture + probe fit least-squares NYATA. Scene ini menghitung ulang
      # seluruh 216 boss di engine dan membandingkannya field demi field.
      - name: "BossDataParityTest (pipeline data boss_data.py ↔ BossData.gd)"
        run: |
          set -o pipefail
          isolated=$(mktemp -d)
          trap 'rm -rf "$isolated"' EXIT
          export XDG_DATA_HOME="$isolated"
          python -m pip install --quiet pygame-ce
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tools/test_boss_data_parity.py
          godot --headless --path godot res://tests/BossDataParityTest.tscn --quit-after 120 2>&1 | tee /tmp/bossdata.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/bossdata.log --label "BossDataParityTest" \
              --require "[BossDataParityTest] PASS" > /tmp/bossdata.gate 2>&1; then
            cat /tmp/bossdata.gate
          else
            cat /tmp/bossdata.gate
            echo "::error::BOSSDATA-FAIL-TAIL: $(tail -40 /tmp/bossdata.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::BOSSDATA-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/bossdata.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      # ── 5. Test paritas sisi pygame yang mengunci konstanta Godot ──
      - name: Test paritas pygame
        run: |
          python -m pip install --quiet pygame-ce
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tools/test_boss_true_aura_parity.py
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tools/test_basic_attack_no_impact_fx.py
          # Kunci perilaku sekolah damage pygame (sumber kebenaran audit
          # basic hero): armor item hero utk semua non-fire, armor/MR
          # boss-tower-minion, Wind Wall/Windrun, resolve context.
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tools/test_damage_school.py
          # Grid spasial + frustum culler + aturan overlay FPS (_system.py).
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tools/test_system_perf_parity.py
          # Percikan/ledakan/panah lane + klaim dead code (_render.py).
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 tools/test_render_parity.py

      # ── 6. Audit paritas visual terpadu ──
      # Dulu "apa yang beda antara tampilan Godot dan pygame?" harus
      # dijawab dengan membuka ratusan berkas satu-satu. Alat ini
      # menjalankan SEMUA pemeriksaan yang bisa diotomatiskan dalam satu
      # perintah dan gagalkan CI kalau ada yang divergen:
      #   PALET     konstanta warna ui_theme.py vs UiTheme.gd
      #   ENCODER   bake harus deterministik (dulu berubah tergantung
      #             ada/tidaknya Pillow -> ratusan berkas berubah)
      #   FRESH-*   re-bake 222 unit + 54 map + 20 props, bandingkan byte
      #   COVERAGE  tiap subsistem punya jalur setia (bake) atau masih
      #             placeholder geometris
      #   SMOKE     semua renderer pygame dipanggil, tangkap exception
      #   HARDCODE  warna UiTheme yang ditulis ulang sebagai literal
      # --full = re-bake SEMUA (bukan sampel); ~4 menit, sepadan karena
      # inilah satu-satunya penjaga keusangan bake di CI.
      # Kalau audit gagal, jangan biarkan CI hanya berkata "Process completed
      # with exit code 1" dengan alasan terkubur di dalam log — baris-baris
      # bagian yang gagal diterbitkan sebagai ANOTASI GitHub supaya langsung
      # terbaca di ringkasan run.
      - name: Audit paritas visual (pygame ↔ Godot)
        run: |
          # numpy WAJIB: tanpa itu renderer minion tim merah memakai
          # jalur BLEND_* yang menghasilkan piksel berbeda, dan bake
          # jadi tidak reproducible antar mesin.
          python -m pip install --quiet pygame-ce pillow numpy
          set +e
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 tools/visual_parity_audit.py --full --report md 2>&1 \
            | tee audit-run.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # GitHub hanya MENYIMPAN ~10 anotasi pertama per langkah, jadi
            # urutkan dari yang paling penting: ringkasan dulu, baru bagian
            # yang gagal. (Baris sisa laporan terbuang kalau dikirim utuh.)
            echo "::error::Audit paritas visual GAGAL (exit ${code})"
            grep -E "^(RINGKASAN|Gagal):" audit-run.log \
              | while IFS= read -r b; do echo "::error::$b"; done
            grep -E "^lingkungan:" audit-run.log \
              | while IFS= read -r b; do echo "::error::$b"; done
            grep -A 5 "^❌" audit-run.log | head -6 \
              | while IFS= read -r b; do echo "::error::$b"; done
            exit "$code"
          fi

      - name: Simpan laporan audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-audit
          path: docs/PARITY_AUDIT.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Simpan log kalau gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: /tmp/*.log
          retention-days: 7
