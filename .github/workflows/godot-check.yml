name: Godot Check (Lite - 30s)

# ═══════════════════════════════════════════════════════
# LITE MODE (OPSI 3) — cuma linter 30 detik
# Dibuat 2026-09-23: user minta hapus yang bikin PR lama.
# Sekarang cuma: gdparse + tscn_lint + check_refs (tanpa Godot headless).
# Kalau ada error runtime, user copy manual log Godot lokal ke sini.
# Mau full check lagi? Tab Actions -> "Godot Check (Lite - 30s)" -> Run workflow
# atau kembalikan file dari git history.
# File asli: godot-check.yml sebelum 2026-09-23 (48 test parity + audit 7 menit)
# ═══════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - 'godot/**'
      - 'tools/**'
      - '.github/workflows/godot-check.yml'
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'tools/**'
      - '.github/workflows/godot-check.yml'
  workflow_dispatch:

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Linter cepat (30s)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Salin aset biner (gitignored)
        run: python3 tools/convert_to_godot.py --assets

      - name: Linter statis (30 detik)
        run: |
          python -m pip install --quiet "gdtoolkit==4.*"
          echo "=== gdparse (parser GDScript 4 asli) ==="
          gdparse $(find godot -name '*.gd')
          echo "=== tscn_lint ==="
          python3 godot/tools/tscn_lint.py $(find godot -name '*.tscn' -o -name '*.tres')
          echo "=== check_refs ==="
          python3 godot/tools/check_refs.py godot
          echo "=== particles_lint ==="
          python3 godot/tools/particles_lint.py godot
          echo "=== map_clutter_lint ==="
          python3 godot/tools/map_clutter_lint.py godot
          echo "=== log_gate ==="
          python3 godot/tools/test_godot_log_gate.py
          echo ""
          echo "✅ LITE PASS — cuma linter, tanpa Godot headless 7 menit."
          echo "Kalau error di Godot lokal, copy log kesini."
