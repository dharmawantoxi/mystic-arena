name: Godot Check (Lite)

# Fast checks for the active main.py migration. The removed legacy godot/
# project and its missing fixtures are not prerequisites for this project.
on:
  pull_request:
    paths:
      - 'godot_rebuild/**'
      - 'tools/prepare_godot_main.py'
      - 'tools/prepare_godot_core.py'
      - 'tools/prepare_godot_archetypes.py'
      - 'tools/prepare_godot_balance.py'
      - 'tools/test_godot_balance_prepare.py'
      - 'tools/prepare_godot_items.py'
      - 'tools/test_godot_items_prepare.py'
      - 'tools/prepare_godot_bosses.py'
      - 'tools/test_godot_bosses_prepare.py'
      - 'tools/test_godot_bosses_parity.py'
      - 'tools/prepare_godot_lighting.py'
      - 'tools/test_godot_lighting_prepare.py'
      - 'tools/prepare_godot_localization.py'
      - 'tools/test_godot_localization_prepare.py'
      - 'tools/test_godot_localization_parity.py'
      - 'tools/prepare_godot_splash.py'
      - 'tools/test_godot_splash_prepare.py'
      - 'tools/test_godot_splash_parity.py'
      - 'splash_screen.py'
      - 'tools/gen_splash_cpp.py'
      - 'tools/prepare_godot_tactical.py'
      - 'tools/test_godot_tactical_prepare.py'
      - 'tools/test_godot_tactical_parity.py'
      - 'tactical_commands.py'
      - 'tools/prepare_godot_ui_theme.py'
      - 'tools/test_godot_ui_theme_prepare.py'
      - 'tools/test_godot_ui_theme_parity.py'
      - 'ui_theme.py'
      - 'tools/test_godot_match_parity.py'
      - 'tools/test_godot_archetypes_prepare.py'
      - 'tools/test_godot_core_prepare.py'
      - '_core.py'
      - 'hero_balance.py'
      - 'hero_items.py'
      - 'lighting.py'
      - 'localization.py'
      - 'bosses/boss_data.py'
      - 'localization.py'
      - 'topup_currency.py'
      - 'map_components/_bundle.py'
      - 'gdlintrc'
      - '_entity.py'
      - 'hero_skills/**'
      - 'heroes/**'
      - 'towers/**'
      - 'bosses/**'
      - 'hero_archetypes.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'tools/gen_boss_smart_ai.py'
      - 'tools/prepare_godot_entities.py'
      - 'tools/test_godot_entity_prepare.py'
      - '_render.py'
      - 'mobile/perf.py'
      - 'map_components/**'
      - 'tools/prepare_godot_render.py'
      - 'tools/test_godot_render_prepare.py'
      - '_system.py'
      - 'storage_paths.py'
      - 'mobile/combat_audio.py'
      - 'tools/prepare_godot_system.py'
      - 'tools/test_godot_system_prepare.py'
      - 'tools/convert_to_godot.py'
      - 'tools/test_godot_main_prepare.py'
      - 'mobile/cloud_save.py'
      - 'tools/test_cloud_save.py'
      - '.github/workflows/godot-check.yml'
  push:
    branches: [main]
    paths:
      - 'godot_rebuild/**'
      - 'tools/prepare_godot_main.py'
      - 'tools/prepare_godot_core.py'
      - 'tools/prepare_godot_archetypes.py'
      - 'tools/prepare_godot_balance.py'
      - 'tools/test_godot_balance_prepare.py'
      - 'tools/prepare_godot_items.py'
      - 'tools/test_godot_items_prepare.py'
      - 'tools/prepare_godot_bosses.py'
      - 'tools/test_godot_bosses_prepare.py'
      - 'tools/test_godot_bosses_parity.py'
      - 'tools/prepare_godot_lighting.py'
      - 'tools/test_godot_lighting_prepare.py'
      - 'tools/prepare_godot_localization.py'
      - 'tools/test_godot_localization_prepare.py'
      - 'tools/test_godot_localization_parity.py'
      - 'tools/prepare_godot_splash.py'
      - 'tools/test_godot_splash_prepare.py'
      - 'tools/test_godot_splash_parity.py'
      - 'splash_screen.py'
      - 'tools/gen_splash_cpp.py'
      - 'tools/prepare_godot_tactical.py'
      - 'tools/test_godot_tactical_prepare.py'
      - 'tools/test_godot_tactical_parity.py'
      - 'tactical_commands.py'
      - 'tools/prepare_godot_ui_theme.py'
      - 'tools/test_godot_ui_theme_prepare.py'
      - 'tools/test_godot_ui_theme_parity.py'
      - 'ui_theme.py'
      - 'tools/test_godot_match_parity.py'
      - 'tools/test_godot_archetypes_prepare.py'
      - 'tools/test_godot_core_prepare.py'
      - '_core.py'
      - 'hero_balance.py'
      - 'hero_items.py'
      - 'lighting.py'
      - 'localization.py'
      - 'bosses/boss_data.py'
      - 'localization.py'
      - 'topup_currency.py'
      - 'map_components/_bundle.py'
      - 'gdlintrc'
      - '_entity.py'
      - 'hero_skills/**'
      - 'heroes/**'
      - 'towers/**'
      - 'bosses/**'
      - 'hero_archetypes.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'tools/gen_boss_smart_ai.py'
      - 'tools/prepare_godot_entities.py'
      - 'tools/test_godot_entity_prepare.py'
      - '_render.py'
      - 'mobile/perf.py'
      - 'map_components/**'
      - 'tools/prepare_godot_render.py'
      - 'tools/test_godot_render_prepare.py'
      - '_system.py'
      - 'storage_paths.py'
      - 'mobile/combat_audio.py'
      - 'tools/prepare_godot_system.py'
      - 'tools/test_godot_system_prepare.py'
      - 'tools/convert_to_godot.py'
      - 'tools/test_godot_main_prepare.py'
      - 'mobile/cloud_save.py'
      - 'tools/test_cloud_save.py'
      - '.github/workflows/godot-check.yml'
  workflow_dispatch:

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Linter cepat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and validate the active native project
        run: |
          python3 tools/prepare_godot_main.py
          python3 tools/prepare_godot_main.py --check
          python3 tools/prepare_godot_core.py
          python3 tools/prepare_godot_core.py --check
          python3 tools/test_godot_core_prepare.py
          python3 tools/prepare_godot_archetypes.py --check
          python3 tools/test_godot_archetypes_prepare.py
          python3 tools/prepare_godot_balance.py --check
          python3 tools/test_godot_balance_prepare.py
          python3 tools/prepare_godot_items.py --check
          python3 tools/test_godot_items_prepare.py
          python3 -m pip install --quiet pygame==2.6.1
          python3 tools/prepare_godot_bosses.py --check
          python3 tools/test_godot_bosses_prepare.py
          python3 tools/test_godot_bosses_parity.py
          python3 tools/prepare_godot_lighting.py --check
          python3 tools/test_godot_lighting_prepare.py
          python3 tools/prepare_godot_localization.py --check
          python3 tools/test_godot_localization_prepare.py
          python3 tools/test_godot_localization_parity.py
          python3 tools/prepare_godot_splash.py --check
          python3 tools/test_godot_splash_prepare.py
          python3 tools/test_godot_splash_parity.py
          python3 tools/prepare_godot_tactical.py --check
          python3 tools/test_godot_tactical_prepare.py
          python3 tools/test_godot_tactical_parity.py
          python3 tools/prepare_godot_ui_theme.py --check
          python3 tools/test_godot_ui_theme_prepare.py
          python3 tools/test_godot_ui_theme_parity.py
          python3 tools/test_localization.py
          python3 tools/prepare_godot_entities.py --check
          python3 tools/test_godot_entity_prepare.py
          python3 tools/prepare_godot_render.py --check
          python3 tools/test_godot_render_prepare.py
          python3 tools/prepare_godot_system.py --check
          python3 tools/test_godot_system_prepare.py
          python3 tools/test_godot_main_prepare.py
          python3 godot_rebuild/tests/validate_project.py
      - name: Python cloud-save oracle
        run: python3 tools/test_cloud_save.py
      - name: GDScript parse, lint and format
        run: |
          python -m pip install --quiet gdtoolkit==4.5.0
          gdparse $(find godot_rebuild -name '*.gd')
          gdlint $(find godot_rebuild -name '*.gd' -not -path '*/entities/generated/*')
          gdformat --check $(find godot_rebuild -name '*.gd' -not -path '*/entities/generated/*')
