name: Godot Check (Lite - 30s)

# Fast checks for the active main.py migration. The removed legacy godot/
# project and its missing fixtures are not prerequisites for this project.
on:
  pull_request:
    paths:
      - 'godot_rebuild/**'
      - 'tools/prepare_godot_main.py'
      - 'tools/prepare_godot_core.py'
      - 'tools/test_godot_core_prepare.py'
      - '_core.py'
      - 'hero_balance.py'
      - 'hero_items.py'
      - 'bosses/boss_data.py'
      - 'localization.py'
      - 'topup_currency.py'
      - 'map_components/_bundle.py'
      - 'gdlintrc'
      - '_entity.py'
      - 'hero_skills/**'
      - 'heroes/**'
      - 'towers/**'
      - 'bosses/**'
      - 'hero_archetypes.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'tools/gen_boss_smart_ai.py'
      - 'tools/prepare_godot_entities.py'
      - 'tools/test_godot_entity_prepare.py'
      - 'tools/convert_to_godot.py'
      - 'tools/test_godot_main_prepare.py'
      - 'mobile/cloud_save.py'
      - 'tools/test_cloud_save.py'
      - '.github/workflows/godot-check.yml'
  push:
    branches: [main]
    paths:
      - 'godot_rebuild/**'
      - 'tools/prepare_godot_main.py'
      - 'tools/prepare_godot_core.py'
      - 'tools/test_godot_core_prepare.py'
      - '_core.py'
      - 'hero_balance.py'
      - 'hero_items.py'
      - 'bosses/boss_data.py'
      - 'localization.py'
      - 'topup_currency.py'
      - 'map_components/_bundle.py'
      - 'gdlintrc'
      - '_entity.py'
      - 'hero_skills/**'
      - 'heroes/**'
      - 'towers/**'
      - 'bosses/**'
      - 'hero_archetypes.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'tools/gen_boss_smart_ai.py'
      - 'tools/prepare_godot_entities.py'
      - 'tools/test_godot_entity_prepare.py'
      - 'tools/convert_to_godot.py'
      - 'tools/test_godot_main_prepare.py'
      - 'mobile/cloud_save.py'
      - 'tools/test_cloud_save.py'
      - '.github/workflows/godot-check.yml'
  workflow_dispatch:

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Linter cepat (30s)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and validate the active native project
        run: |
          python3 tools/prepare_godot_main.py
          python3 tools/prepare_godot_main.py --check
          python3 tools/prepare_godot_core.py
          python3 tools/prepare_godot_core.py --check
          python3 tools/test_godot_core_prepare.py
          python3 tools/prepare_godot_entities.py --check
          python3 tools/test_godot_entity_prepare.py
          python3 tools/test_godot_main_prepare.py
          python3 godot_rebuild/tests/validate_project.py
      - name: Python cloud-save oracle
        run: python3 tools/test_cloud_save.py
      - name: GDScript parse, lint and format
        run: |
          python -m pip install --quiet gdtoolkit==4.5.0
          gdparse $(find godot_rebuild -name '*.gd')
          gdlint $(find godot_rebuild -name '*.gd' -not -path '*/entities/generated/*')
          gdformat --check $(find godot_rebuild -name '*.gd' -not -path '*/entities/generated/*')
