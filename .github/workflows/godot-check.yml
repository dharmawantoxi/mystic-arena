name: Godot Check

# ═══════════════════════════════════════════════════════
# VERIFIKASI PORT GODOT TANPA PERLU GODOT DI MESIN SENDIRI
#
# Kenapa ada: banyak bug port hanya muncul SAAT DIJALANKAN, bukan saat
# parse. Contoh nyata yang lolos semua cek statis:
#
#   Invalid assignment of property or key 'process_material' with value of
#   type 'ParticleProcessMaterial' on a base object of type 'CPUParticles2D'.
#
# Runner GitHub punya internet penuh, jadi di sinilah Godot betulan
# diunduh dan project benar-benar dijalankan headless.
#
# HEMAT KUOTA (pelajaran dari build-android.yml yang dibuat manual-only):
#   * hanya jalan kalau berkas Godot/tool yang berubah (filter `paths`),
#   * binary Godot di-cache antar run (unduh ~40 MB sekali saja),
#   * concurrency: push beruntun membatalkan run yang lama,
#   * timeout 15 menit; run normal ±2-3 menit.
#
# Jalan manual: tab Actions -> "Godot Check" -> Run workflow.
# ═══════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - 'godot/**'
      - '_core.py'
      - '_entity.py'
      - '_render.py'
      - 'hero_items.py'
      - 'hero_balance.py'
      - '_system.py'
      - 'tools/test_damage_school.py'
      - 'levels/**'
      - 'map_components/**'
      - 'bosses/**'
      - 'tools/convert_to_godot.py'
      - 'tools/test_godot_match_parity.py'
      - 'tools/gen_boss_smart_ai.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'hero_skills/**'
      - 'tools/test_boss_true_aura_parity.py'
      - 'tools/test_basic_attack_no_impact_fx.py'
      - '.github/workflows/godot-check.yml'
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '_core.py'
      - '_entity.py'
      - '_render.py'
      - 'hero_items.py'
      - 'hero_balance.py'
      - '_system.py'
      - 'tools/test_damage_school.py'
      - 'levels/**'
      - 'map_components/**'
      - 'bosses/**'
      - 'tools/convert_to_godot.py'
      - 'tools/test_godot_match_parity.py'
      - 'tools/gen_boss_smart_ai.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'hero_skills/**'
      - 'tools/test_boss_true_aura_parity.py'
      - 'tools/test_basic_attack_no_impact_fx.py'
      - '.github/workflows/godot-check.yml'
  workflow_dispatch:

concurrency:
  group: godot-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Harus sama dengan config/features di godot/project.godot
  GODOT_VERSION: '4.3'
  GODOT_RELEASE: 'stable'

jobs:
  check:
    name: Import + smoke test headless
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 1. Cek statis (tidak butuh engine, hitungan detik) ──
      - name: Linter statis
        run: |
          python -m pip install --quiet "gdtoolkit==4.*"
          echo "::group::gdparse (parser GDScript 4 asli)"
          gdparse $(find godot -name '*.gd')
          echo "::endgroup::"
          python3 godot/tools/tscn_lint.py $(find godot -name '*.tscn' -o -name '*.tres')
          python3 godot/tools/check_refs.py godot
          python3 godot/tools/particles_lint.py godot
          python3 godot/tools/test_godot_log_gate.py
          # BossKit.gd adalah HASIL GENERATE dari bosses/base_boss.py —
          # gagal di sini berarti ada perubahan smart-AI pygame yang belum
          # ditranspile (regenerasi: python3 tools/gen_boss_smart_ai.py).
          python3 tools/gen_boss_smart_ai.py --check
          # HeroSkillKit.gd di-transpile dari hero_skills/_bundle.py — gagal di
          # sini berarti ada perubahan skill hero pygame yang belum
          # ditranspile (regenerasi: python3 tools/gen_hero_skill_kit.py).
          python3 tools/gen_hero_skill_kit.py --check
          # Scope-check hasil generate (identifier harus terdeklarasi di
          # param/var lokal/bridge Hero.gd) — tangkap 'Identifier not
          # declared' sebelum engine.
          python3 tools/check_bosskit_scope.py godot/scenes/hero/HeroSkillKit.gd

      # ── 2. Godot binary (di-cache) ──
      - name: Cache Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux-x86_64

      - name: Unduh Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          URL="https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "$URL"
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${V}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Versi Godot
        run: |
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          ~/godot-bin/godot --headless --version

      # ── 3. Import project: di sinilah .tscn/.tres/shader benar-benar dimuat ──
      # Import pertama pada checkout bersih memang mengeluarkan pesan "editor
      # needs to restart"; karena itu dijalankan dua kali, dan log yang dinilai
      # adalah yang KEDUA.
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path godot --import 2>&1 | tee /tmp/import1.log || true
          if grep -qi "unknown command line option" /tmp/import1.log; then
            # Jaga-jaga kalau versi Godot yang dipakai belum punya --import:
            # --editor --quit juga mengimpor lalu keluar.
            godot --headless --path godot --editor --quit 2>&1 | tee /tmp/import.log || true
          else
            # || true: bash runner default -e + pipefail; godot bisa exit != 0
            # saat ada script error — yang menilai lulus/gagal adalah gate,
            # bukan exit code (lihat komentar langkah "Versi Godot" di README).
            godot --headless --path godot --import 2>&1 | tee /tmp/import.log || true
          fi
          # if (bukan RC=$?): bash runner default -e menghentikan langkah
          # tepat di perintah yang gagal sebelum baris berikutnya jalan.
          if python3 godot/tools/godot_log_gate.py /tmp/import.log --label "import" > /tmp/gate.out 2>&1; then
            cat /tmp/gate.out
          else
            cat /tmp/gate.out
            # Pantulkan baris error sebagai anotasi ::error:: supaya penyebab
            # kegagalan terbaca langsung di tab Checks / API check-run tanpa
            # harus mengunduh log artifact.
            grep '|' /tmp/gate.out | sed 's/^[[:space:]]*[0-9]* |[[:space:]]*//' | head -5 | while read -r LINE; do
              [ -z "$LINE" ] && continue
              echo "::error::IMPORT-FAIL: $LINE"
            done
            echo "::error::IMPORT-FAIL-TAIL: $(tail -6 /tmp/import.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      # ── 4. Smoke test yang sudah ada di repo (keduanya self-quit + PASS line) ──
      # Langkah tes: || true + gate (exit code godot tidak bisa dipercaya —
      # lihat README bagian "F5 cuma layar hitam"); kalau gagal, pantulkan
      # ekor log sebagai anotasi ::error:: di tab Checks.
      - name: AIPlayerTest (menu, tanpa combat)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/AIPlayerTest.tscn --quit-after 120 2>&1 | tee /tmp/ai.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/ai.log --label "AIPlayerTest" \
              --require "[AIPlayerTest] PASS" > /tmp/ai.gate 2>&1; then
            cat /tmp/ai.gate
          else
            cat /tmp/ai.gate
            echo "::error::AI-FAIL-TAIL: $(tail -8 /tmp/ai.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      - name: BattleSmokeTest (menu → level 1 → wave + AI)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/BattleSmokeTest.tscn --quit-after 180 2>&1 | tee /tmp/smoke.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/smoke.log --label "BattleSmokeTest" \
              --require "[BattleSmokeTest] PASS" > /tmp/smoke.gate 2>&1; then
            cat /tmp/smoke.gate
          else
            cat /tmp/smoke.gate
            echo "::error::SMOKE-FAIL-TAIL: $(tail -8 /tmp/smoke.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      # Golden data comes from the actual Pygame methods, not a second
      # copy of the Godot formulas. Changes to either implementation run CI.
      - name: GameplayParityTest (Pygame oracle + match lifecycle)
        run: |
          set -o pipefail
          python -m pip install --quiet pygame-ce
          python3 tools/test_godot_match_parity.py
          godot --headless --path godot res://tests/GameplayParityTest.tscn --quit-after 300 2>&1 | tee /tmp/parity.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/parity.log --label "GameplayParityTest" \
              --require "[GameplayParityTest] PASS" > /tmp/parity.gate 2>&1; then
            cat /tmp/parity.gate
          else
            cat /tmp/parity.gate
            echo "::error::PARITY-FAIL-TAIL: $(tail -12 /tmp/parity.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      # --quit-after 960 (~16 dtk @60fps): tes menunggu animasi kematian yang
      # berbasis waktu nyata (90f true boss + perayaan + 60f mini boss).
      - name: CinematicTest (level intro, banner boss, death FX + perayaan)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/CinematicTest.tscn --quit-after 960 2>&1 | tee /tmp/cine.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/cine.log --label "CinematicTest" \
              --require "[CinematicTest] PASS" > /tmp/cine.gate 2>&1; then
            cat /tmp/cine.gate
          else
            cat /tmp/cine.gate
            echo "::error::CINE-FAIL-GATE: $(grep -m3 'FAIL\|ERROR' /tmp/cine.gate | tr '\n' ' | ' | cut -c1-300)"
            echo "::error::CINE-FAIL-TAIL: $(tail -12 /tmp/cine.log | tr '\n' ' | ' | cut -c1-400)"
            echo "::error::CINE-EXPECT: $(grep -m3 'CinematicTest' /tmp/cine.log | tr '\n' ' | ' | cut -c1-400)"
            exit 1
          fi

      # ── 4b. BossCoreParityTest: paritas inti boss (resilience/anti-burst,
      # entrance, enrage/frenzy, tenacity, heal true boss, cleave, ability
      # generik) vs fixture boss_core dari Pygame Boss.update yang asli.
      - name: BossCoreParityTest (data 216 boss + perilaku inti boss)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/BossCoreParityTest.tscn --quit-after 420 2>&1 | tee /tmp/boss.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/boss.log --label "BossCoreParityTest" \
              --require "[BossCoreParityTest] PASS" > /tmp/boss.gate 2>&1; then
            cat /tmp/boss.gate
          else
            cat /tmp/boss.gate
            echo "::error::BOSS-FAIL-TAIL: $(tail -60 /tmp/boss.log | tr '\n' ' | ' | cut -c1-3500)"
            echo "::error::BOSS-FAIL-LINES: $(grep -m8 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/boss.log | tr '\n' ' | ' | cut -c1-2000)"
            exit 1
          fi

      # ── 4c. BossSmartAIParityTest: paritas smart-AI Q/W/E/R 79 boss
      # (summon, dash, transform, dot/debuff, buff, heal, knockback) vs
      # oracle Boss.update pygame asli — 3 skenario × 79 boss, jejak event
      # per frame + state kit final. Serangan dasar dimatikan kedua sisi
      # supaya jejak murni kit (kadens dasar diuji BossCoreParityTest).
      - name: BossSmartAIParityTest (smart-AI 79 boss vs oracle Pygame)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/BossSmartAIParityTest.tscn --quit-after 2400 2>&1 | tee /tmp/smartai.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/smartai.log --label "BossSmartAIParityTest" \
              --require "[BossSmartAIParityTest] PASS" > /tmp/smartai.gate 2>&1; then
            cat /tmp/smartai.gate
          else
            cat /tmp/smartai.gate
            echo "::error::SMARTAI-FAIL-TAIL: $(tail -40 /tmp/smartai.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::SMARTAI-FAIL-LINES: $(grep -m10 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/smartai.log | tr '\n' ' | ' | cut -c1-2500)"
            exit 1
          fi

      # ── 4d. HeroSkillParityTest: paritas QWER SELURUH kit hero (222 hero:
      # 6 starter + 216 boss-hero, registry 66 resep + _fallback_cast) vs
      # oracle Hero.update pygame — 4 skenario × 222 hero, jejak event per
      # frame (attempt/cast/damage/slow/knock/alock/bspd/batk) + state kit
      # final. Fixture = seksi hero_skills (string JSON) di match_parity.json.
      - name: HeroSkillParityTest (kit 222 hero vs oracle Pygame)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/HeroSkillParityTest.tscn --quit-after 900 2>&1 | tee /tmp/heroskill.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/heroskill.log --label "HeroSkillParityTest" \
              --require "[HeroSkillParityTest] PASS" > /tmp/heroskill.gate 2>&1; then
            cat /tmp/heroskill.gate
          else
            cat /tmp/heroskill.gate
            echo "::error::HEROSKILL-FAIL-TAIL: $(tail -40 /tmp/heroskill.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::HEROSKILL-FAIL-LINES: $(grep -m10 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/heroskill.log | tr '\n' ' | ' | cut -c1-2500)"
            exit 1
          fi

      # ── 4e. HeroBasicAttackParityTest: paritas JALUR DAMAGE BASIC hero —
      # kalkulasi _do_attack (bonus item/crit buff/crit item/lifesteal/
      # cleave) + blok mitigasi take_damage TIAP jenis target (armor item
      # utk semua damage non-fire, amp sebelum armor, block setelah armor,
      # shred per rumus target, blind di penyerang, reflect bristleback/
      # thornmail, shield int castle) vs oracle Pygame 29 skenario bebas
      # RNG + probe get_block. Fixture = seksi hero_basic_attack.
      - name: HeroBasicAttackParityTest (jalur damage basic hero vs oracle Pygame)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/HeroBasicAttackParityTest.tscn --quit-after 120 2>&1 | tee /tmp/babasic.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/babasic.log --label "HeroBasicAttackParityTest" \
              --require "[HeroBasicAttackParityTest] PASS" > /tmp/babasic.gate 2>&1; then
            cat /tmp/babasic.gate
          else
            cat /tmp/babasic.gate
            echo "::error::BABASIC-FAIL-TAIL: $(tail -40 /tmp/babasic.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::BABASIC-FAIL-LINES: $(grep -m10 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/babasic.log | tr '\n' ' | ' | cut -c1-2500)"
            exit 1
          fi

      # ── 4f. HeroRngGuardParityTest: paritas ROLL RNG guard hero —
      # windrun (Sylara W, roll 75% evade fisik — netral tanpa source ikut
      # fisik, sihir/fire tidak me-roll) & shadow realm (Zephyr W, kebal
      # total tanpa roll), urutan prioritas guard (shadow → windrun →
      # wind wall → veil → evasion), roll block Scarlet Bulwark 55%,
      # crit Dead Edge 25% (calc DULU mitigasi target; crit buff men-diskip
      # roll; ranged: roll crit saat spawn lalu block saat mendarat),
      # evasion Monarch Wings 28%, blind < 1.0 penyerang (max+true strike),
      # dan windrun pada reflect Bristleback (nested take_damage). Oracle
      # pygame menjalankan take_damage/_do_attack ASLI dengan random.random
      # ter-script per situs roll; replay Godot lewat hook ParityRng
      # (CombatSystem/ItemInventory) membandingkan HP + jumlah/nilai/
      # urutan roll yang terkonsumsi. Fixture = seksi hero_rng_guards.
      - name: HeroRngGuardParityTest (roll RNG guard hero vs oracle Pygame)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/HeroRngGuardParityTest.tscn --quit-after 120 2>&1 | tee /tmp/rngguard.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/rngguard.log --label "HeroRngGuardParityTest" \
              --require "[HeroRngGuardParityTest] PASS" > /tmp/rngguard.gate 2>&1; then
            cat /tmp/rngguard.gate
          else
            cat /tmp/rngguard.gate
            echo "::error::RNGGUARD-FAIL-TAIL: $(tail -40 /tmp/rngguard.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::RNGGUARD-FAIL-LINES: $(grep -m10 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/rngguard.log | tr '\n' ' | ' | cut -c1-2500)"
            exit 1
          fi

      # ── 4g. HeroCatchupUnlockParityTest: paritas SUMBER unlock catch-up
      # hero (FASE 11 progresi). Rumusnya sudah ada, tapi masukannya —
      # jumlah hero non-starter yang dimiliki pemain — dulu selalu 0 di
      # Godot, jadi tiap save berperilaku seperti save BARU pygame. Yang
      # dibandingkan: kunci save + auto-grant starter (AST Game.reset),
      # save lama tidak kehilangan unlock, boss_unlocks_for_purchases per
      # isi save, multiplier catch-up per hero × unlocks × level, dan stat
      # Hero SUNGGUHAN (base_hp/base_damage/max_hp/damage, termasuk setelah
      # upgrade()) vs Hero pygame yang dibuat dengan game_instance terisi.
      # Fixture = seksi hero_catchup_unlocks.
      - name: HeroCatchupUnlockParityTest (sumber unlock catch-up vs oracle Pygame)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/HeroCatchupUnlockParityTest.tscn --quit-after 120 2>&1 | tee /tmp/catchup.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/catchup.log --label "HeroCatchupUnlockParityTest" \
              --require "[HeroCatchupUnlockParityTest] PASS" > /tmp/catchup.gate 2>&1; then
            cat /tmp/catchup.gate
          else
            cat /tmp/catchup.gate
            echo "::error::CATCHUP-FAIL-TAIL: $(tail -40 /tmp/catchup.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::CATCHUP-FAIL-LINES: $(grep -m10 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/catchup.log | tr '\n' ' | ' | cut -c1-2500)"
            exit 1
          fi

      # ── 4h. UiHudParityTest: paritas UI/HUD IN-MATCH (FASE 12). Oracle
      # menjalankan draw pygame ASLI headless (UIRenderer, PopupRenderer,
      # HeroPanel, ItemShopUI, Overlay, Menu, WaveAnnouncer, InputHandler):
      # 82 skenario draw vs teks/geometri/kunci tombol ShopPanel Godot,
      # format gold/income/mode/cooldown/match-time, kurva banner wave 121
      # titik, gate equip melee/magic 222 hero, tabel biaya hero/menara/
      # nexus, klik dunia (slot/hero/menara/move/deselect/klik-kanan),
      # hotkey H/B/N/R/ESC, panel pause 400x400, panel game-over (stat +
      # unlock + NEW HERO), dan audit closed-world ui_key. Fixture = seksi
      # ui_hud. --quit-after 400: mayoritas baterai murni; satu-satunya
      # tunggu waktu-nyata = tween banner (~0.3 dtk via time_scale 8).
      - name: UiHudParityTest (UI/HUD in-match vs oracle Pygame)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/UiHudParityTest.tscn --quit-after 400 2>&1 | tee /tmp/uihud.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/uihud.log --label "UiHudParityTest" \
              --require "[UiHudParityTest] PASS" > /tmp/uihud.gate 2>&1; then
            cat /tmp/uihud.gate
          else
            cat /tmp/uihud.gate
            echo "::error::UIHUD-FAIL-TAIL: $(tail -40 /tmp/uihud.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::UIHUD-FAIL-LINES: $(grep -m80 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/uihud.log | tr '\n' ' | ' | cut -c1-12000)"
            exit 1
          fi

      # ── 4i. MobileSidePanelParityTest: both landscape HUD surfaces exist.
      - name: MobileSidePanelParityTest (right rail + shop)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/MobileSidePanelParityTest.tscn --quit-after 120 2>&1 | tee /tmp/mobile-sidepanel.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/mobile-sidepanel.log --label "MobileSidePanelParityTest" \
              --require "[MobileSidePanelParityTest] PASS" > /tmp/mobile-sidepanel.gate 2>&1; then
            cat /tmp/mobile-sidepanel.gate
          else
            cat /tmp/mobile-sidepanel.gate
            echo "::error::MOBILE-SIDEPANEL-FAIL: $(tail -c 3000 /tmp/mobile-sidepanel.log | tr '\n' '~')"
            echo "::error::MOBILE-SIDEPANEL-LINES: $(grep -m40 -e FAIL -e 'SCRIPT ERROR' -e 'Parse Error' -e 'step:' /tmp/mobile-sidepanel.log | tr '\n' '~' | cut -c1-6000)"
            exit 1
          fi

      # ── 4j. MatchScoringParityTest: paritas KLASTER SKOR MATCH (FASE 13)
      # vs oracle pygame. Oracle menjalankan kode pygame ASLI headless:
      # ComboCounter murni per frame + data draw (label/warna/bar 80x4),
      # loop reward Game.update SUNGGUHAN (unit betulan mati lewat
      # take_damage) utk +150 kill hero (tim korban) + atribusi killer.kills
      # + combo/max_combo/total_kills/gold/ai_gold per frame, SaveManager.
      # update_level_stats (best per level + flag NEW BEST), state machine
      # AchievementPopup + kurva slide 181 titik + trigger popup NEW HERO
      # UNLOCKED! dari _auto_unlock_defeated_boss_heroes. Godot: node
      # Minion/Hero/Tower asli + GameManager/_grant_meta_reward/end_match
      # penuh (save di-snapshot lalu dipulihkan). Fixture = seksi
      # match_scoring. --quit-after 300: baterai mayoritas sinkron; beberapa
      # await frame untuk Main/HUD + tween kematian minion.
      - name: MatchScoringParityTest (klaster skor vs oracle Pygame)
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/MatchScoringParityTest.tscn --quit-after 300 2>&1 | tee /tmp/score.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/score.log --label "MatchScoringParityTest" \
              --require "[MatchScoringParityTest] PASS" > /tmp/score.gate 2>&1; then
            cat /tmp/score.gate
          else
            cat /tmp/score.gate
            echo "::error::SCORE-FAIL-TAIL: $(tail -40 /tmp/score.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::SCORE-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/score.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

