name: Build Android

# ═══════════════════════════════════════════════════════
# APA YANG DILAKUKAN WORKFLOW INI
#   push ke main / PR  -> build APK debug  (bisa langsung di-install)
#   push tag v*        -> build AAB release, ditandatangani, siap
#                          diunggah ke Google Play Console
#
# SECRET yang harus dibuat di GitHub
#   Settings > Secrets and variables > Actions > New repository secret
#     KEYSTORE_BASE64      : hasil `base64 -w0 mystic.keystore`
#     KEYSTORE_PASSWORD    : password keystore
#     KEYALIAS             : nama alias key (mis. mystic)
#     KEYALIAS_PASSWORD    : password alias
# ═══════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Paket sistem yang dibutuhkan p4a
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      # Cache = pembeda antara build 60 menit dan build 8 menit.
      # CACHE_VERSION: naikkan angkanya (v2 -> v3 -> ...) kalau perlu
      # memaksa build bersih. restore-keys sengaja ikut memakai versi
      # ini supaya cache LAMA tidak ikut dipulihkan - kalau ikut, sumber
      # pygame-ce versi lama yang sudah terbongkar akan dipakai ulang
      # oleh p4a ("is already unpacked, skipping") dan error yang sama
      # terulang walau resepnya sudah diperbaiki.
      - name: Cache SDK/NDK & build p4a
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "cython<3.0" virtualenv

      # Cetak konfigurasi yang BENAR-BENAR dipakai. Kalau baris di bawah
      # tidak sesuai harapan, berarti Anda menjalankan commit yang salah.
      - name: Konfigurasi yang dipakai build ini
        run: |
          echo "commit   : $GITHUB_SHA"
          echo "--- buildozer.spec ---"
          grep -E "^(version|android\.(api|minapi|ndk_api|archs|release_artifact))" buildozer.spec
          echo "--- resep pygame-ce ---"
          grep -E "^\s+(version|url) = " p4a-recipes/pygame-ce/__init__.py
          echo "======================================================="
          echo "HARUS terlihat: version = \"2.4.1\"  dan  android.archs = arm64-v8a"
          echo "======================================================="

      # Jaring pengaman: p4a melewati unpack kalau folder sumber sudah ada
      # ("is already unpacked, skipping"). Kalau cache lama sempat ikut
      # terpulihkan, sisa pygame-ce versi lama harus dibuang dulu.
      - name: Buang sisa sumber pygame-ce lama dari cache
        run: |
          rm -rf .buildozer/android/platform/build-*/other_builds/pygame-ce* || true
          rm -rf .buildozer/android/platform/build-*/packages/pygame-ce* || true
          echo "sisa build pygame-ce dibersihkan"

      # ─────────────── DEBUG (APK) ───────────────
      - name: Build APK debug
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: buildozer -v android debug

      - name: Unggah artefak APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: mystic-arena-debug-apk
          path: bin/*.apk
          retention-days: 14

      # ─────────────── RELEASE (AAB) ───────────────
      - name: Siapkan keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$HOME/mystic.keystore"

      - name: Build AAB release (ditandatangani)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          P4A_RELEASE_KEYSTORE: /home/runner/mystic.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEYALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEYALIAS_PASSWORD }}
        run: buildozer -v android release

      - name: Unggah artefak AAB
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mystic-arena-release-aab
          path: bin/*.aab
          retention-days: 90

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.aab
          generate_release_notes: true
