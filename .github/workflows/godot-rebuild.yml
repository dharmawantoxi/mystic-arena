permissions:
  contents: read

concurrency:
  group: godot-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native assets and metadata
        run: |
          set -euo pipefail
          {
            python tools/prepare_godot_main.py
            python tools/prepare_godot_main.py --check
            python tools/prepare_godot_core.py
            python tools/prepare_godot_core.py --check
            python tools/test_godot_core_prepare.py
            python tools/prepare_godot_archetypes.py --check
            python tools/test_godot_archetypes_prepare.py
            python tools/prepare_godot_balance.py --check
            python tools/test_godot_balance_prepare.py
            python tools/prepare_godot_items.py --check
            python tools/test_godot_items_prepare.py
            python -m pip install --quiet pygame==2.6.1
            python tools/prepare_godot_bosses.py --check
            python tools/test_godot_bosses_prepare.py
            python tools/test_godot_bosses_parity.py
            python tools/prepare_godot_lighting.py --check
            python tools/test_godot_lighting_prepare.py
            python tools/prepare_godot_localization.py --check
            python tools/test_godot_localization_prepare.py
            python tools/test_godot_localization_parity.py
            python tools/prepare_godot_splash.py --check
            python tools/test_godot_splash_prepare.py
            python tools/test_godot_splash_parity.py
            python tools/prepare_godot_tactical.py --check
            python tools/test_godot_tactical_prepare.py
            python tools/test_godot_tactical_parity.py
          python tools/prepare_godot_ui_theme.py --check
          python tools/test_godot_ui_theme_prepare.py
          python tools/test_godot_ui_theme_parity.py
            python tools/test_localization.py
            python tools/prepare_godot_entities.py --check
            python tools/test_godot_entity_prepare.py
            python tools/prepare_godot_render.py --check
            python tools/test_godot_render_prepare.py
            python tools/prepare_godot_system.py --check
            python tools/test_godot_system_prepare.py
            python godot_rebuild/tests/validate_project.py
            python tools/test_godot_main_prepare.py
          } 2>&1 | tee /tmp/godot-prepare.log
      - name: Publish prepare diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('/tmp/godot-prepare.log')
          text = path.read_text(errors='replace') if path.exists() else 'Log not created.'
          summary = ['### Godot prepare diagnostics', '```text', text[-16000:], '```']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(summary) + '\n')
          lines = text.splitlines()
          selected = [(i, line) for i, line in enumerate(lines)
                      if any(marker in line for marker in
                             ('Traceback', 'Error', 'ERROR', 'FAIL', 'Stale', 'failed', 'AssertionError'))]
          for index, line in selected[-12:]:
              context = ' | '.join(lines[max(0, index - 1):index + 6])[:1200]
              context = context.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Godot prepare::{context}', flush=True)
          PY
      - name: GDScript parse, lint and format
        run: |
          python -m pip install gdtoolkit==4.5.0
          gdparse $(find godot_rebuild -name '*.gd')
          gdlint $(find godot_rebuild -name '*.gd' -not -path '*/entities/generated/*')
          gdformat --check $(find godot_rebuild -name '*.gd' -not -path '*/entities/generated/*')
      - name: Install pinned official Godot
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot-engine"
          GODOT="$RUNNER_TEMP/godot-engine/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version
      - name: Import the native project
        run: |
          set -euo pipefail
          timeout 180 "$GODOT" --headless --path godot_rebuild --editor --import > /tmp/godot-import.log 2>&1 || { cat /tmp/godot-import.log; exit 1; }
          cat /tmp/godot-import.log
          if grep -qE 'SCRIPT ERROR:|ERROR:' /tmp/godot-import.log; then exit 1; fi
      - name: Native regression tests
        run: |
          set -euo pipefail
          timeout 120 "$GODOT" --headless --path godot_rebuild --script res://tests/run_all.gd > /tmp/godot-tests.log 2>&1 || { cat /tmp/godot-tests.log; exit 1; }
          cat /tmp/godot-tests.log
          if grep -qE 'SCRIPT ERROR:|ERROR:|FAIL:' /tmp/godot-tests.log; then exit 1; fi
          grep '^PASS:' /tmp/godot-tests.log
      - name: Boot the actual main scene
        run: |
          set -euo pipefail
          timeout 30 "$GODOT" --headless --path godot_rebuild --quit-after 180 > /tmp/godot-boot.log 2>&1 || { cat /tmp/godot-boot.log; exit 1; }
          cat /tmp/godot-boot.log
          if grep -qE 'SCRIPT ERROR:|ERROR:' /tmp/godot-boot.log; then exit 1; fi
          grep '\[GODOT\] Mystic Arena' /tmp/godot-boot.log
      - name: Publish readable runtime diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          summary = ['### Godot runtime diagnostics']
          for stage in ('import', 'tests', 'boot'):
              path = Path(f'/tmp/godot-{stage}.log')
              text = path.read_text(errors='replace') if path.exists() else 'Log not created.'
              summary.extend([f'#### {stage}', '```text', text[-16000:], '```'])
              lines = text.splitlines()
              selected = [(i, line) for i, line in enumerate(lines)
                          if any(marker in line for marker in
                                 ('SCRIPT ERROR:', 'ERROR:', 'FAIL:', 'Parse Error', 'PASS:'))]
              for index, line in selected[-12:]:
                  context = ' | '.join(lines[max(0, index - 1):index + 3])[:1200]
                  context = context.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  level = 'notice' if 'PASS:' in line else 'error'
                  print(f'::{level} title=Godot {stage}::{context}', flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(summary) + '\n')
          PY
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-native-system-test-logs
          path: /tmp/godot-*.log
          if-no-files-found: ignore
