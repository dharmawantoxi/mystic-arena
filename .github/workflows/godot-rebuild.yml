name: Godot Rebuild (native, fresh project)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'godot_rebuild/**'
      - '_core.py'
      - '_system.py'
      - '_render.py'
      - 'heroes/combat_feel.py'
      - 'heroes/kaizen_fx.py'
      - 'heroes/grimjaw_fx.py'
      - 'heroes/sylara_fx.py'
      - 'heroes/vex_fx.py'
      - 'hero_skills/_bundle.py'
      - 'main.py'
      - 'main_desktop_legacy.py'
      - 'mobile/touch.py'
      - 'mobile/hud.py'
      - 'levels/level_data.py'
      - '_entity.py'
      - 'bosses/boss_data.py'
      - 'hero_balance.py'
      - 'hero_archetypes.py'
      - 'towers/_bundle.py'
      - 'map_components/_bundle.py'
      - '.github/workflows/godot-rebuild.yml'
  push:
    paths:
      - 'godot_rebuild/**'
      - '_core.py'
      - '_system.py'
      - '_render.py'
      - 'heroes/combat_feel.py'
      - 'heroes/kaizen_fx.py'
      - 'heroes/grimjaw_fx.py'
      - 'heroes/sylara_fx.py'
      - 'heroes/vex_fx.py'
      - 'hero_skills/_bundle.py'
      - 'main.py'
      - 'main_desktop_legacy.py'
      - 'mobile/touch.py'
      - 'mobile/hud.py'
      - 'levels/level_data.py'
      - '_entity.py'
      - 'bosses/boss_data.py'
      - 'hero_balance.py'
      - 'hero_archetypes.py'
      - 'towers/_bundle.py'
      - 'map_components/_bundle.py'
      - '.github/workflows/godot-rebuild.yml'

permissions:
  contents: read

concurrency:
  group: godot-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static guardrails and GDScript lint
        run: |
          python -m pip install gdtoolkit==4.5.0
          python godot_rebuild/tests/validate_project.py
          python godot_rebuild/tests/check_source_contract.py
          python godot_rebuild/tests/structure_source_oracle.py
          python godot_rebuild/tests/match_source_oracle.py
          python godot_rebuild/tests/game_speed_source_oracle.py
          python godot_rebuild/tests/hit_stop_source_oracle.py
          python godot_rebuild/tests/upgrade_source_oracle.py
          python godot_rebuild/tests/nexus_source_oracle.py
          python godot_rebuild/tests/cannon_source_oracle.py
          python godot_rebuild/tests/ice_source_oracle.py
          python godot_rebuild/tests/mage_source_oracle.py
          python godot_rebuild/tests/kaizen_source_oracle.py
          python godot_rebuild/tests/ai_source_oracle.py
          python godot_rebuild/tests/ai_draft_source_oracle.py
          python godot_rebuild/tests/player_recruit_source_oracle.py
          python godot_rebuild/tests/meta_hero_unlock_source_oracle.py
          python godot_rebuild/tests/tactical_command_source_oracle.py
          python godot_rebuild/tests/player_structure_command_source_oracle.py
          python godot_rebuild/tests/controller_source_oracle.py
          python godot_rebuild/tests/touch_gesture_source_oracle.py
          python godot_rebuild/tests/save_slot_source_oracle.py
          python godot_rebuild/tests/cloud_save_source_oracle.py
          python godot_rebuild/tests/level_stats_source_oracle.py
          python godot_rebuild/tests/ai_upgrade_source_oracle.py
          python godot_rebuild/tests/ai_shield_source_oracle.py
          python godot_rebuild/tests/floating_text_source_oracle.py
          python godot_rebuild/tests/hit_particle_source_oracle.py
          python godot_rebuild/tests/popup_animation_source_oracle.py
          python godot_rebuild/tests/screen_shake_source_oracle.py
          gdparse $(find godot_rebuild -name '*.gd')
          gdlint $(find godot_rebuild -name '*.gd')
          gdformat --check $(find godot_rebuild -name '*.gd')
      - name: Java 17 for Android plugin compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build the Godot Android plugin-v2 AAR
        shell: bash
        run: |
          set -euo pipefail
          {
            sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
            godot_rebuild/android_plugin/cloud_save/build_plugin.sh
          } 2>&1 | tee /tmp/cloud-save-plugin-build.log
      - name: Report Android plugin build output
        if: failure()
        shell: bash
        run: |
          if [[ -s /tmp/cloud-save-plugin-build.log ]]; then
            python - <<'PY'
          from pathlib import Path
          text = "\n".join(Path("/tmp/cloud-save-plugin-build.log").read_text(errors="replace").splitlines()[-80:])
          escaped = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Android plugin build output::{escaped}")
          PY
            {
              echo "### Android plugin build output"
              echo '```text'
              tail -n 80 /tmp/cloud-save-plugin-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install the pinned official engine
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          binary="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$RUNNER_TEMP/godot-rebuild-engine"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}" \
            --output "$RUNNER_TEMP/godot-rebuild-engine/$archive"
          unzip -q "$RUNNER_TEMP/godot-rebuild-engine/$archive" -d "$RUNNER_TEMP/godot-rebuild-engine"
          chmod +x "$RUNNER_TEMP/godot-rebuild-engine/$binary"
          echo "GODOT=$RUNNER_TEMP/godot-rebuild-engine/$binary" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/godot-rebuild-engine/$binary" --version
      - name: Native import (not the old converter)
        shell: bash
        run: |
          set -euo pipefail
          code=0
          timeout 120 "$GODOT" --headless --path godot_rebuild --editor --import 2>&1 | tee /tmp/rebuild-import.log || code=$?
          if [[ "$code" != 0 ]] || grep -qE 'SCRIPT ERROR:|ERROR:' /tmp/rebuild-import.log; then
            python godot_rebuild/tests/annotate_failure.py /tmp/rebuild-import.log
            exit 1
          fi
      - name: Native simulation, input and screen lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          code=0
          timeout 180 "$GODOT" --headless --path godot_rebuild --script res://tests/run_all.gd 2>&1 | tee /tmp/rebuild-tests.log || code=$?
          if [[ "$code" != 0 ]] || grep -qE 'SCRIPT ERROR:|ERROR:|FAIL:' /tmp/rebuild-tests.log; then
            python godot_rebuild/tests/annotate_failure.py /tmp/rebuild-tests.log
            exit 1
          fi
          grep -E 'PASS: .* checks; fixed ticks' /tmp/rebuild-tests.log | sed 's/^/::notice title=Native Godot tests::/'
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-rebuild-test-logs
          path: /tmp/rebuild-*.log
          if-no-files-found: ignore
