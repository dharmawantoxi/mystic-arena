name: Godot main.py migration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'godot_rebuild/**'
      - 'main.py'
      - 'mobile/touch.py'
      - 'levels/level_data.py'
      - 'assets/**'
      - 'tools/prepare_godot_main.py'
      - '.github/workflows/godot-rebuild.yml'
  push:
    paths:
      - 'godot_rebuild/**'
      - 'main.py'
      - 'mobile/touch.py'
      - 'levels/level_data.py'
      - 'assets/**'
      - 'tools/prepare_godot_main.py'
      - '.github/workflows/godot-rebuild.yml'

permissions:
  contents: read

concurrency:
  group: godot-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native assets and metadata
        run: |
          python tools/prepare_godot_main.py
          python tools/prepare_godot_main.py --check
          python godot_rebuild/tests/validate_project.py
          python tools/test_godot_main_prepare.py
      - name: GDScript parse, lint and format
        run: |
          python -m pip install gdtoolkit==4.5.0
          gdparse $(find godot_rebuild -name '*.gd')
          gdlint $(find godot_rebuild -name '*.gd')
          gdformat --check $(find godot_rebuild -name '*.gd')
      - name: Install pinned official Godot
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot-engine"
          GODOT="$RUNNER_TEMP/godot-engine/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version
      - name: Native import and regression tests
        run: |
          set -euo pipefail
          timeout 180 "$GODOT" --headless --path godot_rebuild --editor --import > /tmp/godot-import.log 2>&1 || { cat /tmp/godot-import.log; exit 1; }
          cat /tmp/godot-import.log
          if grep -qE 'SCRIPT ERROR:|ERROR:' /tmp/godot-import.log; then exit 1; fi
          timeout 120 "$GODOT" --headless --path godot_rebuild --script res://tests/run_all.gd > /tmp/godot-tests.log 2>&1 || { cat /tmp/godot-tests.log; exit 1; fi
          cat /tmp/godot-tests.log
          if grep -qE 'SCRIPT ERROR:|ERROR:|FAIL:' /tmp/godot-tests.log; then exit 1; fi
          grep '^PASS:' /tmp/godot-tests.log
      - name: Boot the actual main scene
        run: |
          set -euo pipefail
          timeout 30 "$GODOT" --headless --path godot_rebuild --quit-after 180 > /tmp/godot-boot.log 2>&1 || { cat /tmp/godot-boot.log; exit 1; }
          cat /tmp/godot-boot.log
          if grep -qE 'SCRIPT ERROR:|ERROR:' /tmp/godot-boot.log; then exit 1; fi
          grep '\[GODOT\] Mystic Arena' /tmp/godot-boot.log
      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-main-test-logs
          path: /tmp/godot-*.log
          if-no-files-found: ignore
