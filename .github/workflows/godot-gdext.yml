name: Godot GDExtension (godot++) — MANUAL ONLY

# ═══════════════════════════════════════════════════════
# LITE MODE (OPSI 3) — 2026-09-23
# Dibuat manual-only biar PR godot/ nggak nunggu 30 menit.
# Dulu: PR otomatis build 6 lib (±30 menit).
# Sekarang: CUMA jalan kalau kamu klik manual:
#   Tab Actions -> "Godot GDExtension (godot++) — MANUAL ONLY" -> Run workflow
# Push ke main tetap jalan biar main tetap kejaga (opsional, bisa dihapus juga).
# File asli ada di git history sebelum 2026-09-23.
# ═══════════════════════════════════════════════════════

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'godot/gdext/**'
      - 'godot/addons/mystic_*/**'
      - '.github/workflows/godot-gdext.yml'

concurrency:
  group: godot-gdext-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: '4.3'
  GODOT_RELEASE: 'stable'
  GODOT_CPP_REF: 'godot-4.3-stable'
  SCONS_FLAGS: 'platform=linux target=template_debug optimize=none debug_symbols=no'

jobs:
  build:
    name: Build 6 lib + paritas C++ (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cek freshness generator (tanpa compiler, detik)
        run: |
          python3 tools/gen_hero_skill_kit.py --check
          python3 tools/gen_hero_skills_cpp.py --check
          python3 tools/gen_levels_cpp.py --check
          python3 tools/gen_maps_cpp.py --check
          python3 tools/gen_mobile_cpp.py --check
          python3 tools/gen_splash_cpp.py --check
          python3 tools/gen_ui_cpp.py --check

      - name: Paritas statis + self-test C++ tanpa engine
        run: |
          python3 tools/test_godot_level_data_parity.py
          python3 tools/test_levels_cpp_selftest.py
          python3 tools/test_godot_map_data_parity.py
          python3 tools/test_maps_cpp_selftest.py
          python3 tools/test_ui_cpp_selftest.py
          python3 tools/test_splash_cpp_selftest.py

      # Build berat 30 menit cuma jalan di manual dispatch / push main
      - name: Build godot-cpp + 6 lib (butuh 20-30 menit)
        run: |
          echo "⏭️  Skip build berat di Lite Mode — cuma freshness check di atas"
          echo "Kalau mau build beneran, jalankan manual dari Actions tab"
          echo "Atau kembalikan workflow lama dari git history"
