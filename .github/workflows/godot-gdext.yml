name: Godot GDExtension (godot++)

# ═══════════════════════════════════════════════════════
# BUILD + UJI GDExtension C++ (hero_skills/_bundle.py + levels/level_data.py
# + map_components/_bundle.py -> godot++)
#
# Kenapa workflow TERPISAH dari godot-check.yml:
#   * godot-check.yml menjaga jalur GDScript (HeroSkillKit.gd) dan sengaja
#     TIDAK butuh compiler — lib .so/.dll tidak ikut repo, jadi di sana
#     HeroSkillKitLoader selalu jatuh ke fallback GDScript.
#   * Di sini lib C++ BENERAN dibuild (godot-cpp + scons, ±10 menit dengan
#     cache) lalu HeroSkillGdextParityTest memutar ulang oracle Pygame
#     (222 hero × 4 skenario) lewat MysticHeroSkills, dan
#     LevelDataGdextParityTest memutar ulang oracle levels/level_data.py
#     (54 level × 17 field + 4 helper) lewat MysticLevels, dan
#     MapDataGdextParityTest memutar ulang oracle map_components/_bundle.py
#     (54 tema + PathGenerator + DecorationGenerator + derive) lewat
#     MysticMaps. Tanpa workflow ini, "sudah dimigrasikan ke C++" hanya
#     klaim: kode yang tidak pernah dikompilasi/dijalankan bisa basi
#     diam-diam.
#   * godot-cpp di-clone SEKALI ke godot/gdext/godot-cpp lalu di-symlink ke
#     tiap ekstensi: objek compile-nya dipakai bersama, jadi tiga lib hanya
#     membayar satu compile godot-cpp.
#
# HEMAT KUOTA:
#   * hanya jalan kalau berkas GDExt/skill/generator yang berubah (filter paths),
#   * godot-cpp (sumber + objek hasil compile) di-cache per commit SHA,
#   * binary Godot di-cache (pola sama dengan godot-check.yml),
#   * concurrency membatalkan run lama, timeout 45 menit.
#
# Jalan manual: tab Actions -> "Godot GDExtension (godot++)" -> Run workflow.
# ═══════════════════════════════════════════════════════

on:
  pull_request:
    paths:
      - 'godot/gdext/**'
      - 'godot/addons/mystic_skills/**'
      - 'godot/addons/mystic_lighting/**'
      - 'godot/scenes/hero/HeroSkillKit.gd'
      - 'godot/scenes/hero/HeroSkillKitLoader.gd'
      - 'godot/scenes/hero/Hero.gd'
      - 'godot/tests/HeroSkillParityTest.gd'
      - 'godot/tests/HeroSkillGdextParityTest.gd'
      - 'godot/tests/HeroSkillGdextParityTest.tscn'
      - 'godot/project.godot'
      - 'hero_skills/**'
      - 'tools/gen_hero_skills_cpp.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'tools/gen_levels_cpp.py'
      - 'tools/test_godot_level_data_parity.py'
      - 'tools/test_levels_cpp_selftest.py'
      - 'godot/addons/mystic_levels/**'
      - 'godot/scripts/core/LevelDB.gd'
      - 'godot/scripts/core/LevelDBLoader.gd'
      - 'godot/scripts/core/BossDB.gd'
      - 'godot/tests/LevelDataParityTest.gd'
      - 'godot/tests/LevelDataGdextParityTest.gd'
      - 'godot/tests/LevelDataGdextParityTest.tscn'
      - 'godot/tests/fixtures/level_data.json'
      - 'levels/**'
      - 'tools/gen_maps_cpp.py'
      - 'tools/test_godot_map_data_parity.py'
      - 'tools/test_maps_cpp_selftest.py'
      - 'godot/addons/mystic_maps/**'
      - 'ui_components/**'
      - 'tools/gen_ui_cpp.py'
      - 'tools/test_ui_cpp_selftest.py'
      - 'godot/addons/mystic_ui/**'
      - 'mobile/**'
      - 'tools/gen_mobile_cpp.py'
      - 'tools/test_mobile_cpp_selftest.py'
      - 'godot/addons/mystic_mobile/**'
      - 'godot/scripts/core/MapDB.gd'
      - 'godot/scripts/core/MapDBLoader.gd'
      - 'godot/scenes/map/ArenaMap.gd'
      - 'godot/tests/MapDataParityTest.gd'
      - 'godot/tests/MapDataParityTest.tscn'
      - 'godot/tests/MapDataGdextParityTest.gd'
      - 'godot/tests/MapDataGdextParityTest.tscn'
      - 'godot/tests/fixtures/map_data.json'
      - 'map_components/**'
      - '.github/workflows/godot-gdext.yml'
  push:
    branches: [main]
    paths:
      - 'godot/gdext/**'
      - 'godot/addons/mystic_skills/**'
      - 'godot/addons/mystic_lighting/**'
      - 'godot/scenes/hero/HeroSkillKit.gd'
      - 'godot/scenes/hero/HeroSkillKitLoader.gd'
      - 'godot/scenes/hero/Hero.gd'
      - 'godot/tests/HeroSkillParityTest.gd'
      - 'godot/tests/HeroSkillGdextParityTest.gd'
      - 'godot/tests/HeroSkillGdextParityTest.tscn'
      - 'godot/project.godot'
      - 'hero_skills/**'
      - 'tools/gen_hero_skills_cpp.py'
      - 'tools/gen_hero_skill_kit.py'
      - 'tools/gen_levels_cpp.py'
      - 'tools/test_godot_level_data_parity.py'
      - 'tools/test_levels_cpp_selftest.py'
      - 'godot/addons/mystic_levels/**'
      - 'godot/scripts/core/LevelDB.gd'
      - 'godot/scripts/core/LevelDBLoader.gd'
      - 'godot/scripts/core/BossDB.gd'
      - 'godot/tests/LevelDataParityTest.gd'
      - 'godot/tests/LevelDataGdextParityTest.gd'
      - 'godot/tests/LevelDataGdextParityTest.tscn'
      - 'godot/tests/fixtures/level_data.json'
      - 'levels/**'
      - 'tools/gen_maps_cpp.py'
      - 'tools/test_godot_map_data_parity.py'
      - 'tools/test_maps_cpp_selftest.py'
      - 'godot/addons/mystic_maps/**'
      - 'ui_components/**'
      - 'tools/gen_ui_cpp.py'
      - 'tools/test_ui_cpp_selftest.py'
      - 'godot/addons/mystic_ui/**'
      - 'mobile/**'
      - 'tools/gen_mobile_cpp.py'
      - 'tools/test_mobile_cpp_selftest.py'
      - 'godot/addons/mystic_mobile/**'
      - 'godot/scripts/core/MapDB.gd'
      - 'godot/scripts/core/MapDBLoader.gd'
      - 'godot/scenes/map/ArenaMap.gd'
      - 'godot/tests/MapDataParityTest.gd'
      - 'godot/tests/MapDataParityTest.tscn'
      - 'godot/tests/MapDataGdextParityTest.gd'
      - 'godot/tests/MapDataGdextParityTest.tscn'
      - 'godot/tests/fixtures/map_data.json'
      - 'map_components/**'
      - '.github/workflows/godot-gdext.yml'
  workflow_dispatch:

concurrency:
  group: godot-gdext-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Harus sama dengan config/features di godot/project.godot
  GODOT_VERSION: '4.3'
  GODOT_RELEASE: 'stable'
  # godot-cpp WAJIB se-versi dengan engine (ABI GDExtension per minor version)
  GODOT_CPP_REF: 'godot-4.3-stable'
  # optimize=none debug_symbols=no: yang diuji PARITAS, bukan kecepatan;
  # memangkas waktu compile godot-cpp (±950 berkas) drastis di runner.
  SCONS_FLAGS: 'platform=linux target=template_debug optimize=none debug_symbols=no'

jobs:
  build:
    name: Build mystic_skills + mystic_levels + mystic_maps + mystic_ui + mystic_mobile + paritas C++ vs oracle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 0. Kesegaran transpile (detik, tanpa compiler) ──
      # HeroSkillKit.gd (GDScript) dan hero_skills_processor.h/.cpp (C++)
      # keduanya dibangkitkan dari hero_skills/_bundle.py. Kalau salah satu
      # basi, build C++ di bawah mengunci perilaku LAMA — jadi dicek dulu.
      - name: Cek freshness generator
        run: |
          python3 tools/gen_hero_skill_kit.py --check
          python3 tools/gen_hero_skills_cpp.py --check
          # levels/level_data.py -> levels_processor.h/.cpp (FASE 34). Kalau
          # ini gagal, build C++ di bawah mengunci tabel level yang BASI.
          python3 tools/gen_levels_cpp.py --check
          # map_components/_bundle.py -> maps_processor.h/.cpp (FASE 35).
          # Sama: tabel tema/lane/dekor basi tidak boleh dibuild.
          python3 tools/gen_maps_cpp.py --check
          # mobile/*.py -> mobile_processor.h/.cpp (FASE 37). Sama: ambang
          # gesture/HUD/kualitas basi tidak boleh dibuild.
          python3 tools/gen_mobile_cpp.py --check

      # ── 0b. Paritas statis + self-test C++ di luar engine (levels) ──
      # test_godot_level_data_parity.py: levels.json + FIELD_KINDS LevelDB.gd +
      # literal tabel C++ vs ALL_LEVELS Python, fixture engine segar, wiring
      # closed-world (loader/autoload/project.godot/.gdextension/.gitignore/
      # kedua workflow). Tanpa compiler.
      # test_levels_cpp_selftest.py: MENG-EXECUTE levels_processor.cpp apa
      # adanya lewat stub Variant (godot/gdext/mystic_levels/selftest) — 245
      # perintah: 54 baris x 17 field (nilai + tipe + urutan kunci), row_index,
      # get_level_config, get_level_count, is_level_unlocked, get_next_level,
      # py_contains (termasuk deviasi bool/int yang terdokumentasi). Butuh g++
      # saja (tanpa godot-cpp), jalan ±2 detik, dan sengaja ditempatkan SEBELUM
      # build godot-cpp yang ±10 menit: regresi data gagal cepat dan murah.
      - name: Paritas levels (statis + self-test C++ tanpa engine)
        run: |
          python3 tools/test_godot_level_data_parity.py
          python3 tools/test_levels_cpp_selftest.py

      # ── 0c. Paritas statis + self-test C++ di luar engine (maps, FASE 35) ──
      # test_godot_map_data_parity.py: themes_raw.json + KEY_KINDS/waypoint/
      # struktur dekor/stream MT19937/derive MapDB.gd + literal tabel C++ vs
      # _bundle.py Python, fixture engine segar, wiring closed-world
      # (ArenaMap -> MapDBLoader, project.godot, .gdextension, .gitignore,
      # kedua workflow). Tanpa compiler.
      # test_maps_cpp_selftest.py: MENG-EXECUTE maps_processor.cpp apa adanya
      # lewat stub Variant (godot/gdext/mystic_maps/selftest) — 200 perintah:
      # 54 tema x kunci union (nilai + tipe + urutan), palet, index/build,
      # make_curved_path (tepi + 4 ukuran), generate_lanes/generate_river,
      # generate_decorations penuh (14 kategori, replika MT19937 bit-eksak).
      # Butuh g++ saja, dan sengaja SEBELUM build godot-cpp yang ±10 menit.
      - name: Paritas maps (statis + self-test C++ tanpa engine)
        run: |
          python3 tools/test_godot_map_data_parity.py
          python3 tools/test_maps_cpp_selftest.py

      # ── 0d. Self-test C++ di luar engine (UI, FASE 36) ──
      # test_ui_cpp_selftest.py: MENG-EXECUTE ui_processor.cpp apa adanya lewat
      # stub Variant (godot/gdext/mystic_ui/selftest) — 208 cek di CI / 213
      # dengan checkout godot-cpp: geometri popup
      # build/panel hero/kartu toko vs fixture ui_hud (direkam draw pygame ASLI),
      # kurva slide popup unlock, tombol popup menara/nexus, label, dan
      # closed-world tabel perintah == bind == deklarasi .h. Butuh g++ saja.
      # Kalau checkout godot-cpp ada (mis. lokal), skrip juga compile+link+strip
      # .so probe dengan flag default godot-cpp lalu mengulang cek langkah build
      # di bawah: entry via `nm -D`, isi modul via string khas yang tahan strip.
      - name: Self-test C++ tanpa engine (UI, FASE 36)
        run: |
          python3 tools/gen_ui_cpp.py --check
          python3 tools/test_ui_cpp_selftest.py

      # ── 0e. Self-test C++ di luar engine (mobile, FASE 37) ──
      # test_mobile_cpp_selftest.py: MENG-EXECUTE mobile_processor.cpp apa
      # adanya lewat stub Variant (godot/gdext/mystic_mobile/selftest) dengan
      # oracle mobile/*.py ASLI (di-exec tanpa import pygame): ambang gesture
      # touch, geometri tombol HUD + visibilitas, preset/gubernur kualitas,
      # AdaptiveQuality, safe area + posisi panel, overlay debug, konfigurasi
      # suara tempur + gerbang play, validasi payload cloud + ringkasan, dan
      # label build. Butuh g++ saja; SEBELUM build godot-cpp: regresi ambang
      # gagal cepat dan murah.
      - name: Self-test C++ tanpa engine (mobile, FASE 37)
        run: |
          python3 tools/gen_mobile_cpp.py --check
          python3 tools/test_mobile_cpp_selftest.py

      # ── 1. godot-cpp: sumber + objek build di-cache per commit SHA ──
      - name: Resolve commit godot-cpp
        id: cpp-ref
        run: |
          SHA=$(git ls-remote https://github.com/godotengine/godot-cpp "$GODOT_CPP_REF" | cut -f1)
          if [ -z "$SHA" ]; then echo "::error::gagal resolve $GODOT_CPP_REF"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "godot-cpp $GODOT_CPP_REF = $SHA"

      # Cache SATU checkout bersama (bukan per ekstensi): kuncinya versi
      # -shared-v1 karena lokasinya pindah dari godot/gdext/mystic_skills/.
      - name: Cache godot-cpp (sumber + objek, dipakai bersama)
        id: cache-cpp
        uses: actions/cache@v4
        with:
          path: godot/gdext/godot-cpp
          key: godot-cpp-${{ steps.cpp-ref.outputs.sha }}-linux-template_debug-optnone-shared-v1
          # save-always: tanpa ini cache HANYA tersimpan kalau job sukses, jadi
          # tiap run yang gagal di langkah tes membayar ulang compile godot-cpp
          # (±10 menit) — persis yang terjadi saat debug PR FASE 34. Objek scons
          # bersifat inkremental per berkas, jadi cache dari job yang gagal
          # tetap aman dipakai (scons memverifikasi signature tiap target).
          save-always: true

      - name: Clone godot-cpp (sekali untuk semua lib)
        if: steps.cache-cpp.outputs.cache-hit != 'true'
        run: |
          rm -rf godot/gdext/godot-cpp
          git clone -b "$GODOT_CPP_REF" --depth 1 \
            https://github.com/godotengine/godot-cpp \
            godot/gdext/godot-cpp

      # SConstruct tiap ekstensi mengharapkan godot-cpp DI DALAM direktorinya
      # sendiri; symlink ke checkout bersama adalah jembatannya. Objek compile
      # godot-cpp (±950 berkas) hidup di dalam direktori itu, jadi mystic_skills,
      # mystic_levels, mystic_maps, dan mystic_ui memakai ulang hasil compile
      # yang sama — satu compile godot-cpp untuk empat lib. Semua symlink
      # di-gitignore.
      - name: Symlink godot-cpp ke tiap ekstensi
        run: |
          set -euo pipefail
          for lib in mystic_skills mystic_levels mystic_maps mystic_ui mystic_mobile; do
            link="godot/gdext/$lib/godot-cpp"
            rm -rf "$link"
            ln -s ../godot-cpp "$link"
            test -f "$link/SConstruct" || {
              echo "::error::$link tidak menunjuk checkout godot-cpp"; exit 1; }
            echo "[gdext] $link -> ../godot-cpp"
          done

      - name: Install scons
        run: python -m pip install --quiet scons

      # ── 2. Build lib C++ ──
      # Output: godot/addons/mystic_skills/bin/libmystic_skills.linux.template_debug.x86_64.so
      # (nama berkas = suffix scons; .gdextension memetakannya ke kunci
      # linux.debug.x86_64 — jangan "dikoreksi" jadi .linux.debug. tanpa
      # template_, engine tidak akan pernah menemukan lib-nya.)
      - name: Build mystic_skills (linux x86_64)
        working-directory: godot/gdext/mystic_skills
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          scons $SCONS_FLAGS -j"$(nproc)"
          SO=../../addons/mystic_skills/bin/libmystic_skills.linux.template_debug.x86_64.so
          ls -lh ../../addons/mystic_skills/bin/
          test -s "$SO" || { echo "::error::$SO tidak dihasilkan scons"; exit 1; }
          # entry_symbol di mystic_skills.gdextension harus benar-benar ada,
          # kalau tidak Godot menolak memuat lib tanpa pesan yang jelas.
          nm -D --defined-only "$SO" | grep -q " T mystic_skills_library_init" \
            || { echo "::error::symbol mystic_skills_library_init tidak diekspor"; exit 1; }
          echo "[gdext] OK: $SO + symbol entry ada"

      # ── 2b. Build mystic_levels (levels/level_data.py -> godot++) ──
      # Output: godot/addons/mystic_levels/bin/libmystic_levels.linux.template_debug.x86_64.so
      # (suffix scons = nama berkas; kunci .gdextension-nya linux.debug.x86_64.)
      - name: Build mystic_levels (linux x86_64)
        working-directory: godot/gdext/mystic_levels
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          scons $SCONS_FLAGS -j"$(nproc)"
          SO=../../addons/mystic_levels/bin/libmystic_levels.linux.template_debug.x86_64.so
          ls -lh ../../addons/mystic_levels/bin/
          test -s "$SO" || { echo "::error::$SO tidak dihasilkan scons"; exit 1; }
          nm -D --defined-only "$SO" | grep -q " T mystic_levels_library_init" \
            || { echo "::error::symbol mystic_levels_library_init tidak diekspor"; exit 1; }
          echo "[gdext] OK: $SO + symbol entry ada"

      # ── 2c. Build mystic_maps (map_components/_bundle.py -> godot++, FASE 35) ──
      # Output: godot/addons/mystic_maps/bin/libmystic_maps.linux.template_debug.x86_64.so
      # (suffix scons = nama berkas; kunci .gdextension-nya linux.debug.x86_64.)
      - name: Build mystic_maps (linux x86_64)
        working-directory: godot/gdext/mystic_maps
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          scons $SCONS_FLAGS -j"$(nproc)"
          SO=../../addons/mystic_maps/bin/libmystic_maps.linux.template_debug.x86_64.so
          ls -lh ../../addons/mystic_maps/bin/
          test -s "$SO" || { echo "::error::$SO tidak dihasilkan scons"; exit 1; }
          nm -D --defined-only "$SO" | grep -q " T mystic_maps_library_init" \
            || { echo "::error::symbol mystic_maps_library_init tidak diekspor"; exit 1; }
          echo "[gdext] OK: $SO + symbol entry ada"

      # ── 2d. Build mystic_ui (ui_components/_bundle.py -> godot++, FASE 36) ──
      # Output: godot/addons/mystic_ui/bin/libmystic_ui.linux.template_debug.x86_64.so
      # (suffix scons = nama berkas; kunci .gdextension-nya linux.debug.x86_64.)
      - name: Build mystic_ui (linux x86_64)
        working-directory: godot/gdext/mystic_ui
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          scons $SCONS_FLAGS -j"$(nproc)"
          SO=../../addons/mystic_ui/bin/libmystic_ui.linux.template_debug.x86_64.so
          ls -lh ../../addons/mystic_ui/bin/
          test -s "$SO" || { echo "::error::$SO tidak dihasilkan scons"; exit 1; }
          nm -D --defined-only "$SO" | grep -q " T mystic_ui_library_init" \
            || { echo "::error::symbol mystic_ui_library_init tidak diekspor"; exit 1; }
          # Isi modul UI harus benar-benar ada di .so. Symbol table TIDAK bisa
          # dipakai untuk ini, dua-duanya sudah terbukti gagal di CI PR #234:
          #   * `nm -D | grep MysticUI` MUSTAHIL cocok — symbols_visibility
          #     default godot-cpp = hidden (-fvisibility=hidden), jadi hanya
          #     entry point GDE_EXPORT di atas yang ada di symbol table dinamis;
          #   * `nm -C --defined-only | grep "godot::MysticUI::"` juga MUSTAHIL
          #     cocok — SCONS_FLAGS memakai debug_symbols=no sehingga godot-cpp
          #     menambah `-s` ke LINKFLAGS (tools/common_compiler_flags.py) dan
          #     .so di-strip: symbol table statisnya HILANG (`nm` bilang
          #     "no symbols").
          # Yang tahan strip adalah string khas dari generator: nama kelas di
          # tabel bind + api_signature(). Ditampung ke variabel dulu, BUKAN
          # disalurkan ke `grep -q`: keluaran strings besar (±ribuan baris) bikin
          # grep -q menutup pipe lebih dulu → strings kena SIGPIPE →
          # `set -o pipefail` menganggapnya gagal (gagal palsu).
          STRINGS=$(strings -a "$SO")
          case "$STRINGS" in
            *ui_v1:11mod:80fn:*) ;;
            *) echo "::error::api_signature ui_v1:11mod:80fn: tidak ada di $SO"; exit 1 ;;
          esac
          case "$STRINGS" in
            *MysticUI*) ;;
            *) echo "::error::nama kelas MysticUI tidak ada di $SO"; exit 1 ;;
          esac
          echo "[gdext] isi modul UI ada di $SO (api_signature + kelas MysticUI)"
          echo "[gdext] OK: $SO + symbol entry ada"

      # mystic_mobile (FASE 37): pola persis mystic_ui — entry via nm -D,
      # isi modul via string khas yang tahan strip (visibility=hidden +
      # debug_symbols=no membunuh symbol table statis).
      - name: Build mystic_mobile (linux x86_64)
        working-directory: godot/gdext/mystic_mobile
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          scons $SCONS_FLAGS -j"$(nproc)"
          SO=../../addons/mystic_mobile/bin/libmystic_mobile.linux.template_debug.x86_64.so
          ls -lh ../../addons/mystic_mobile/bin/
          test -s "$SO" || { echo "::error::$SO tidak dihasilkan scons"; exit 1; }
          nm -D --defined-only "$SO" | grep -q " T mystic_mobile_library_init" \
            || { echo "::error::symbol mystic_mobile_library_init tidak diekspor"; exit 1; }
          STRINGS=$(strings -a "$SO")
          case "$STRINGS" in
            *mobile_v1:8mod:66fn:*) ;;
            *) echo "::error::api_signature mobile_v1:8mod:66fn: tidak ada di $SO"; exit 1 ;;
          esac
          case "$STRINGS" in
            *MysticMobile*) ;;
            *) echo "::error::nama kelas MysticMobile tidak ada di $SO"; exit 1 ;;
          esac
          echo "[gdext] isi modul mobile ada di $SO (api_signature + kelas MysticMobile)"
          echo "[gdext] OK: $SO + symbol entry ada"

      # ── 3. Godot binary (di-cache; pola sama dengan godot-check.yml) ──
      - name: Cache Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux-x86_64

      - name: Unduh Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          URL="https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip "$URL"
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${V}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Versi Godot
        run: |
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          ~/godot-bin/godot --headless --version

      # ── 4. Aset biner gitignored (sounds/items/presplash) ──
      # Tanpa presplash, boot engine mencetak error ke log headless yang
      # menutupi error sungguhan. --assets hanya os+shutil (tanpa pygame).
      - name: Salin aset biner (gitignored)
        run: python3 tools/convert_to_godot.py --assets

      # ── 5. Import project: di sinilah .gdextension + lib C++ DIMUAT ──
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --path godot --import 2>&1 | tee /tmp/import1.log || true
          godot --headless --path godot --import 2>&1 | tee /tmp/import.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/import.log --label "import" > /tmp/gate.out 2>&1; then
            cat /tmp/gate.out
          else
            cat /tmp/gate.out
            grep '|' /tmp/gate.out | sed 's/^[[:space:]]*[0-9]* |[[:space:]]*//' | head -5 | while read -r LINE; do
              [ -z "$LINE" ] && continue
              echo "::error::IMPORT-FAIL: $LINE"
            done
            exit 1
          fi

      # ── 6. UJI UTAMA: skill C++ vs oracle Pygame ──
      # HeroSkillGdextParityTest memaksa backend loader ke "gdext", lalu:
      #   (a) A/B backend untuk SEMUA hero_type katalog: hero_kind() +
      #       visual_duration(q/w/e/r) C++ vs GDScript, plus tie-break
      #       __by_pair0 (stabilitas sort Python);
      #   (b) replay fixture match_parity.json["hero_skills"] (direkam dari
      #       Hero.update pygame ASLI: 222 hero × 4 skenario, jejak event per
      #       frame + state final) lewat Hero.gd -> MysticHeroSkills (C++).
      # Require dua penanda: PASS dari test DAN baris loader yang membuktikan
      # jalur C++ benar-benar dipakai (bukan diam-diam fallback GDScript).
      - name: "HeroSkillGdextParityTest (hero_skills C++ ↔ oracle Pygame)"
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/HeroSkillGdextParityTest.tscn --quit-after 900 2>&1 \
            | tee /tmp/skillgdext.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/skillgdext.log --label "HeroSkillGdextParityTest" \
              --require "[HeroSkillGdextParityTest] PASS" \
              --require "GDExtension MysticHeroSkills aktif" > /tmp/skillgdext.gate 2>&1; then
            cat /tmp/skillgdext.gate
          else
            cat /tmp/skillgdext.gate
            echo "::error::SKILL-GDEXT-FAIL-TAIL: $(tail -40 /tmp/skillgdext.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::SKILL-GDEXT-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/skillgdext.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      # ── 7. Regresi jalur GDScript ──
      # Loader + HeroSkillKit.gd disentuh PR ini; dengan lib C++ TERPASANG
      # tapi flag project.godot tetap false, replay oracle harus tetap lulus
      # lewat GDScript (fallback tidak boleh rusak karena ada lib).
      - name: "HeroSkillParityTest (baseline GDScript, lib terpasang)"
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/HeroSkillParityTest.tscn --quit-after 900 2>&1 \
            | tee /tmp/heroskill.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/heroskill.log --label "HeroSkillParityTest" \
              --require "[HeroSkillParityTest] PASS" > /tmp/heroskill.gate 2>&1; then
            cat /tmp/heroskill.gate
          else
            cat /tmp/heroskill.gate
            echo "::error::SKILL-GDSCRIPT-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/heroskill.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      # ── 8. UJI UTAMA FASE 34: katalog level C++ vs oracle Python ──
      # LevelDataGdextParityTest memaksa backend LevelDBLoader ke "gdext" lalu:
      #   (a) A/B backend untuk SELURUH permukaan API (54 baris katalog lewat
      #       str(Dictionary) — ikut mengunci urutan kunci, 22 kasus
      #       get_level_config, 20 is_level_unlocked, 15 py_contains, 2 deviasi
      #       bool/int, 17 get_next_level termasuk tipe nilai balik float);
      #   (b) replay godot/tests/fixtures/level_data.json yang direkam
      #       levels/level_data.py ASLI (nilai + TIPE Python per field) lewat
      #       MysticLevels (C++), termasuk wiring produksi BossDB/GameManager/
      #       SaveManager.
      # Require dua penanda: PASS dari test DAN baris loader yang membuktikan
      # jalur C++ benar-benar dipakai (bukan diam-diam fallback GDScript).
      # XDG_DATA_HOME diisolasi: test ini snapshot + restore data SaveManager.
      - name: "LevelDataGdextParityTest (levels C++ ↔ oracle level_data.py)"
        run: |
          set -o pipefail
          isolated=$(mktemp -d)
          trap 'rm -rf "$isolated"' EXIT
          export XDG_DATA_HOME="$isolated"
          godot --headless --path godot res://tests/LevelDataGdextParityTest.tscn --quit-after 120 2>&1 \
            | tee /tmp/levelsgdext.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/levelsgdext.log --label "LevelDataGdextParityTest" \
              --require "[LevelDataGdextParityTest] PASS" \
              --require "GDExtension MysticLevels aktif" > /tmp/levelsgdext.gate 2>&1; then
            cat /tmp/levelsgdext.gate
          else
            cat /tmp/levelsgdext.gate
            echo "::error::LEVELS-GDEXT-FAIL-TAIL: $(tail -40 /tmp/levelsgdext.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::LEVELS-GDEXT-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/levelsgdext.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      # ── 9. Regresi jalur GDScript (lib levels TERPASANG, flag tetap false) ──
      # Scene yang sama dengan godot-check.yml, tapi di sini libmystic_levels.so
      # ada di addons/: fallback GDScript tidak boleh rusak hanya karena lib-nya
      # terpasang (pola langkah 7 untuk hero_skills).
      - name: "LevelDataParityTest (baseline GDScript, lib terpasang)"
        run: |
          set -o pipefail
          isolated=$(mktemp -d)
          trap 'rm -rf "$isolated"' EXIT
          export XDG_DATA_HOME="$isolated"
          godot --headless --path godot res://tests/LevelDataParityTest.tscn --quit-after 120 2>&1 \
            | tee /tmp/levels.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/levels.log --label "LevelDataParityTest" \
              --require "[LevelDataParityTest] PASS" > /tmp/levels.gate 2>&1; then
            cat /tmp/levels.gate
          else
            cat /tmp/levels.gate
            echo "::error::LEVELS-GDSCRIPT-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/levels.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      # ── 10. UJI UTAMA FASE 35: katalog peta C++ vs oracle Python ──
      # MapDataGdextParityTest memaksa backend MapDBLoader ke "gdext" lalu:
      #   (a) A/B backend untuk SELURUH permukaan API (54 baris katalog lewat
      #       str(Dictionary) — ikut mengunci urutan kunci, palet, 56 kasus
      #       theme_index, 5 get_theme, 5 build_theme, 5 kurva, lane/river 2
      #       ukuran, dekor 2 varian, 54 derive);
      #   (b) replay godot/tests/fixtures/map_data.json yang direkam
      #       map_components/_bundle.py ASLI (nilai + TIPE Variant per kunci)
      #       lewat MysticMaps (C++), termasuk derive vs themes.json dan
      #       wiring produksi ArenaMap (scene asli).
      # Require dua penanda: PASS dari test DAN baris loader yang membuktikan
      # jalur C++ benar-benar dipakai (bukan diam-diam fallback GDScript).
      - name: "MapDataGdextParityTest (maps C++ ↔ oracle _bundle.py)"
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/MapDataGdextParityTest.tscn --quit-after 120 2>&1 \
            | tee /tmp/mapsgdext.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/mapsgdext.log --label "MapDataGdextParityTest" \
              --require "[MapDataGdextParityTest] PASS" \
              --require "GDExtension MysticMaps aktif" > /tmp/mapsgdext.gate 2>&1; then
            cat /tmp/mapsgdext.gate
          else
            cat /tmp/mapsgdext.gate
            echo "::error::MAPS-GDEXT-FAIL-TAIL: $(tail -40 /tmp/mapsgdext.log | tr '\n' ' | ' | cut -c1-3000)"
            echo "::error::MAPS-GDEXT-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/mapsgdext.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      # ── 11. Regresi jalur GDScript (lib maps TERPASANG, flag tetap false) ──
      # Scene yang sama dengan godot-check.yml, tapi di sini libmystic_maps.so
      # ada di addons/: fallback GDScript tidak boleh rusak hanya karena lib-nya
      # terpasang (pola langkah 7/9 untuk hero_skills/levels).
      - name: "MapDataParityTest (baseline GDScript, lib terpasang)"
        run: |
          set -o pipefail
          godot --headless --path godot res://tests/MapDataParityTest.tscn --quit-after 120 2>&1 \
            | tee /tmp/maps.log || true
          if python3 godot/tools/godot_log_gate.py /tmp/maps.log --label "MapDataParityTest" \
              --require "[MapDataParityTest] PASS" > /tmp/maps.gate 2>&1; then
            cat /tmp/maps.gate
          else
            cat /tmp/maps.gate
            echo "::error::MAPS-GDSCRIPT-FAIL-LINES: $(grep -m40 'FAIL\|SCRIPT ERROR\|Parse Error' /tmp/maps.log | tr '\n' ' | ' | cut -c1-8000)"
            exit 1
          fi

      - name: Simpan log kalau gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-gdext-logs
          path: /tmp/*.log
          retention-days: 7
