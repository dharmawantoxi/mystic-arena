# ================================================================
# render.yaml — Blueprint Render untuk Cloud Save Mystic Arena
#
# Deploy ke tier GRATIS (free web service). Render sudah memasang
# variable PORT, dan server.py memakai PORT secara otomatis.
#
# ⚠ PENTING: Render FREE memakai filesystem sementara. File di
# ./cloud_data hilang saat service restart/redeploy/spin-down.
# → Solusi GRATIS yang tahan lama: CLOUDFLARE R2 di bawah.
#   Agar save PERSISTEN, isi env MYSTIC_CLOUD_R2_* di dashboard Render
#   (variabel di sini bertanda "sync: false" akan diminta saat deploy).
# ================================================================
services:
  - type: web
    name: mystic-arena-cloud
    runtime: python
    plan: free
    buildCommand: "pip install -r tools/cloud_server/requirements.txt"
    startCommand: "python tools/cloud_server/server.py"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MYSTIC_CLOUD_API_KEY
        generateValue: true
      # Cloudflare R2 — set nilainya di Render dashboard (sync: false
      # artinya Render tidak menyediakan nilai default; user mengisi).
      - key: MYSTIC_CLOUD_R2_ENDPOINT
        sync: false
      - key: MYSTIC_CLOUD_R2_BUCKET
        sync: false
      - key: MYSTIC_CLOUD_R2_ACCESS_KEY_ID
        sync: false
      - key: MYSTIC_CLOUD_R2_SECRET_ACCESS_KEY
        sync: false
      - key: MYSTIC_CLOUD_R2_PREFIX
        value: mystic_arena
